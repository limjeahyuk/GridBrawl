<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 — 난이도</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}
.spr{image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation-iteration-count:infinite}
.n6{animation-name:f6;animation-timing-function:steps(6)}.n8{animation-name:f8;animation-timing-function:steps(8)}
@keyframes f6{to{background-position:120% 0}}@keyframes f8{to{background-position:114.2857% 0}}
.s-cairn{background-image:url(/redesign/sprites/cairn/idle.png)}.s-sable{background-image:url(/redesign/sprites/sable/idle.png)}.s-dirge{background-image:url(/redesign/sprites/dirge/idle.png)}.s-slime{background-image:url(/redesign/sprites/slime/idle.png)}.s-goblin{background-image:url(/redesign/sprites/goblin/idle.png)}
.lay{position:absolute;left:0;top:0;width:100%;height:390px;background-repeat:repeat-x;background-size:auto 390px;image-rendering:pixelated}
.l-sky{background-image:url(/redesign/bg/grassland/sky.png)}.l-clouds{background-image:url(/redesign/bg/grassland/clouds.png)}.l-mtn{background-image:url(/redesign/bg/grassland/mountains.png)}.l-hills{background-image:url(/redesign/bg/grassland/hills.png)}.l-meadow{background-image:url(/redesign/bg/grassland/meadow.png)}
.l-wall{background-image:url(/redesign/bg/dungeon/wall.png)}.l-light{background-image:url(/redesign/bg/dungeon/torchlight.png)}.l-floor{background-image:url(/redesign/bg/dungeon/floor.png)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;box-sizing:border-box;background:rgba(26,22,38,0.94);border:2px solid #4a4058;color:#efe9f5;font-family:'Do Hyeon',sans-serif;font-size:18px;text-decoration:none;cursor:pointer}
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;box-sizing:border-box;background:#f4d470;color:#1d1408;border:3px solid #2a1c10;box-shadow:0 4px 0 #7a5418;font-family:'Do Hyeon',sans-serif;font-size:20px;text-decoration:none;cursor:pointer}
.px{font-family:'Silkscreen',monospace}
.safe{position:absolute;top:0;bottom:0;width:44px;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,90,90,0.0) 0 6px,rgba(255,90,90,0.0) 6px 12px)}
.tier{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;height:56px;padding:0 10px;box-sizing:border-box;background:#1a1626;border:2px solid #3a3150;color:#efe9f5;font:inherit;text-align:left;cursor:pointer}
.tier-on{border-color:#f4d470;box-shadow:inset 0 0 0 2px #f4d470;background:#221c30}
.tier:disabled{cursor:not-allowed}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #0c0a12; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5">
  <div class="lay l-wall"></div><div class="lay l-light"></div><div class="lay l-floor"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,8,16,0.7)"></div>
  <a href="MobileSelect.dc.html" class="btn" style="position: absolute; left: 44px; top: 12px">◀ 이전으로</a>
  <span class="px" style="position: absolute; right: 44px; top: 26px; font-size: 10px; letter-spacing: 3px; color: #f4d470">2 / 2</span>

  <aside style="position: absolute; left: 44px; top: 66px; width: 200px; bottom: 12px; box-sizing: border-box; background: #1a1626; border: 2px solid #3c9c98; display: flex; flex-direction: column">
    <div style="position: relative; height: 150px; background: linear-gradient(180deg, #123a40 0%, #0d2a30 100%); border-bottom: 2px solid #0a0810; overflow: hidden">
      <div class="spr n6 s-cairn" role="img" aria-label="Warrior" style="position: absolute; left: 50%; bottom: 6px; margin-left: -72px; width: 192px; height: 128px; background-size: 1152px 128px; animation-duration: 720ms"></div>
    </div>
    <div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 4px">
      <b class="px" style="font-size: 18px; color: #fff6dc">Warrior</b>
      <span style="font-size: 11px; color: #b9b1c9">전사 · HP 103</span>
      <span style="font-size: 12px; color: #e4def0">{{record}}</span>
    </div>
  </aside>

  <main style="position: absolute; left: 260px; right: 44px; top: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0 0 2px; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 26px; color: #fff6dc; height: 44px; line-height: 44px">난이도</h1>
    <sc-for list="{{tiers}}" as="t" hint-placeholder-count="4">
      <button type="button" class="tier {{t.on}}" disabled="{{t.locked}}" onClick="{{t.pick}}" style="opacity: {{t.op}}">
        <span class="px" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}; border: 2px solid {{t.color}}; font-size: 15px; color: {{t.color}}">{{t.num}}</span>
        <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
          <span style="font-family: 'Do Hyeon', sans-serif; font-size: 19px; color: {{t.color}}">{{t.name}}</span>
          <span style="font-size: 11px; line-height: 1.35; color: #e4def0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.desc}}</span>
        </span>
        <span style="font-size: 11px; color: {{t.tagc}}; white-space: nowrap">{{t.tag}}</span>
      </button>
    </sc-for>
    <div style="margin-top: auto; display: flex; justify-content: flex-end">
      <a href="MobileMap.dc.html" class="go">{{cta}}</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 1 }; }
  renderVals() {
    const T = [
      { name: '초급', num: 'I', color: '#8ad05a', bg: '#1e3014', desc: '적이 내 움직임을 거의 못 읽는다.' },
      { name: '중급', num: 'II', color: '#6ab8ff', bg: '#14243a', desc: '적이 내 첫 카드를 읽는다.' },
      { name: '고급', num: 'III', color: '#ffa24a', bg: '#3a2010', desc: '적이 내 3장을 전부 보고 자리를 짚는다.' },
      { name: '최고급', num: 'IV', color: '#ff6a6a', bg: '#3a1016', desc: '제일 아픈 한 장을 막거나 피한다.' },
    ];
    const cleared = [true, false, false, false];
    const sel = this.state.sel;
    const tiers = T.map((t, i) => {
      const un = i === 0 || cleared[i - 1];
      return Object.assign({}, t, { on: i === sel ? 'tier-on' : '', locked: !un, op: un ? 1 : 0.5,
        tag: cleared[i] ? '클리어 ✓' : un ? (i === sel ? '선택됨' : '도전 가능') : '🔒 ' + T[i - 1].name + ' 클리어',
        tagc: cleared[i] ? '#b6ea6a' : un ? '#c9c2d6' : '#8a849a', pick: un ? () => this.setState({ sel: i }) : undefined });
    });
    return { tiers, cta: T[sel].name + '으로 출발 ▶', record: '초급 클리어 · 최고 14층' };
  }
}
</script>
</body>
</html>
