<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 — 영웅 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}
.spr{image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation-iteration-count:infinite}
.n6{animation-name:f6;animation-timing-function:steps(6)}.n8{animation-name:f8;animation-timing-function:steps(8)}
@keyframes f6{to{background-position:120% 0}}@keyframes f8{to{background-position:114.2857% 0}}
.s-cairn{background-image:url(/redesign/sprites/cairn/idle.png)}.s-sable{background-image:url(/redesign/sprites/sable/idle.png)}.s-dirge{background-image:url(/redesign/sprites/dirge/idle.png)}.s-slime{background-image:url(/redesign/sprites/slime/idle.png)}.s-goblin{background-image:url(/redesign/sprites/goblin/idle.png)}
.lay{position:absolute;left:0;top:0;width:100%;height:390px;background-repeat:repeat-x;background-size:auto 390px;image-rendering:pixelated}
.l-sky{background-image:url(/redesign/bg/grassland/sky.png)}.l-clouds{background-image:url(/redesign/bg/grassland/clouds.png)}.l-mtn{background-image:url(/redesign/bg/grassland/mountains.png)}.l-hills{background-image:url(/redesign/bg/grassland/hills.png)}.l-meadow{background-image:url(/redesign/bg/grassland/meadow.png)}
.l-wall{background-image:url(/redesign/bg/dungeon/wall.png)}.l-light{background-image:url(/redesign/bg/dungeon/torchlight.png)}.l-floor{background-image:url(/redesign/bg/dungeon/floor.png)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;box-sizing:border-box;background:rgba(26,22,38,0.94);border:2px solid #4a4058;color:#efe9f5;font-family:'Do Hyeon',sans-serif;font-size:18px;text-decoration:none;cursor:pointer}
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;box-sizing:border-box;background:#f4d470;color:#1d1408;border:3px solid #2a1c10;box-shadow:0 4px 0 #7a5418;font-family:'Do Hyeon',sans-serif;font-size:20px;text-decoration:none;cursor:pointer}
.px{font-family:'Silkscreen',monospace}
.safe{position:absolute;top:0;bottom:0;width:44px;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,90,90,0.0) 0 6px,rgba(255,90,90,0.0) 6px 12px)}
.hb{position:absolute;left:0;top:0;width:693px;height:390px;background-size:693px 390px;background-repeat:no-repeat}
.hb-cairn{background-image:url(/redesign/heroes/bg-cairn.png)}.hb-sable{background-image:url(/redesign/heroes/bg-sable.png)}.hb-dirge{background-image:url(/redesign/heroes/bg-dirge.png)}
.tab{position:relative;flex:1;height:58px;padding:0;border:2px solid #4a4058;background-color:#1a1626;background-repeat:no-repeat;background-size:333px 187px;cursor:pointer;overflow:hidden;font:inherit;color:inherit}
.tab-on{border-color:#f4d470;box-shadow:inset 0 0 0 2px #f4d470}
.fadeIn{animation:fi .35s ease-out}@keyframes fi{from{opacity:0}to{opacity:1}}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: #0c0a12; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5">
  <div class="hb fadeIn {{h.bg}} {{pk}}" role="img" aria-label="{{h.name}} 일러스트"></div>
  <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; right: 0; width: 520px; background: linear-gradient(90deg, rgba(10,8,16,0) 0%, rgba(10,8,16,0.82) 34%)"></div>
  <a href="MobileTitle.dc.html" class="btn" style="position: absolute; left: 44px; top: 12px">◀ 돌아가기</a>

  <section style="position: absolute; left: 432px; right: 44px; top: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 26px; color: #fff6dc">영웅 선택</h1>
      <span class="px" style="font-size: 10px; letter-spacing: 3px; color: #f4d470">1 / 2</span>
    </div>
    <nav style="display: flex; gap: 6px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" class="tab {{t.bg}} {{t.cls}}" style="background-position: {{t.pos}}" onClick="{{t.onTap}}" aria-label="{{t.name}} 고르기">
          <span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 6px; text-align: left; background: linear-gradient(180deg, rgba(10,8,16,0) 0%, rgba(10,8,16,0.92) 60%)"><b class="px" style="font-size: 12px; color: #fff6dc">{{t.name}}</b></span>
        </button>
      </sc-for>
    </nav>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: rgba(20,16,30,0.92); border: 2px solid {{h.edge}}">
      <div style="display: flex; gap: 8px; align-items: baseline">
        <h2 class="px" style="margin: 0; font-size: 24px; color: #fff6dc">{{h.name}}</h2>
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 17px; color: {{h.accent}}">{{h.cls}}</span>
        <span style="margin-left: auto; font-size: 11px; color: #b9b1c9">{{h.epithet}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span class="px" style="font-size: 11px; width: 20px; color: #ff8a8a">HP</span>
        <div style="flex-grow: 1; height: 10px; background: #0a0810; border: 2px solid #3a3150"><div style="width: {{h.hpPct}}%; height: 100%; background: #e0485a"></div></div>
        <span class="px" style="font-size: 12px; width: 30px; text-align: right">{{h.hp}}</span>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5"><b style="color: {{h.accent}}">{{h.passive}}</b> — {{h.passiveDesc}}</p>
      <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: {{h.sigBg}}; border: 2px solid {{h.edge}}">
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 16px">시그니처 · {{h.sig}}</span>
        <span class="px" style="font-size: 10px; color: {{h.sigFg}}">{{h.sigStat}}</span>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end">
      <a href="MobileDifficulty.dc.html" class="go">{{h.name}}로 다음 ▶</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'cairn', k: 0 }; }
  renderVals() {
    const st = this.state;
    const H = {
      cairn: { name: 'Warrior', cls: '전사', epithet: 'Oathbound Warden', hp: '103', hpPct: 94, accent: '#7fd6c8', edge: '#3c9c98', passive: '불침의 서약', passiveDesc: '받는 공격 피해 -3, 매 라운드 체력 +2.', sig: '서약의 파쇄', sigStat: 'DM23 EN24', sigBg: '#0f2a30', sigFg: '#bff5ec', face: [240, 140] },
      sable: { name: 'Archer', cls: '궁수', epithet: 'Ashen Fletcher', hp: '81', hpPct: 74, accent: '#ffa24a', edge: '#c4501c', passive: '독니', passiveDesc: '내 공격 피해 +3, 피해를 주면 중독 1겹.', sig: '독의 비', sigStat: 'DM20 EN23', sigBg: '#2a160e', sigFg: '#ffd0a0', face: [215, 212] },
      dirge: { name: 'Wizard', cls: '마법사', epithet: 'Azure Witch', hp: '78', hpPct: 71, accent: '#c9a6ff', edge: '#8d6fd0', passive: '혼백의 마법서', passiveDesc: '매 라운드 기력 +6, 보호막 +4.', sig: '종언의 만가', sigStat: 'DM22 EN25', sigBg: '#1e1436', sigFg: '#e0d0ff', face: [262, 186] },
    };
    // 탭 = 1280×720 배경을 333×187로 줄여(0.26) 얼굴 근처를 보여 준다
    const Z = 0.26 * 1.0;
    const tabs = ['cairn', 'sable', 'dirge'].map((id) => ({ name: H[id].name, bg: 'hb-' + id, cls: id === st.sel ? 'tab-on' : '',
      pos: `${Math.round(-(H[id].face[0] * 333 / 1280 * 1.0) + 40)}px ${Math.round(-(H[id].face[1] * 187 / 720) + 18)}px`,
      onTap: () => this.setState({ sel: id, k: st.k + 1 }) }));
    return { h: Object.assign({ bg: 'hb-' + st.sel }, H[st.sel]), tabs, pk: 'k' + (st.k % 2) };
  }
}
</script>
</body>
</html>
