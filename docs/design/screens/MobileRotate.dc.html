<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 — 세로 안내</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}
.spr{image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation-iteration-count:infinite}
.n6{animation-name:f6;animation-timing-function:steps(6)}.n8{animation-name:f8;animation-timing-function:steps(8)}
@keyframes f6{to{background-position:120% 0}}@keyframes f8{to{background-position:114.2857% 0}}
.s-cairn{background-image:url(/redesign/sprites/cairn/idle.png)}.s-sable{background-image:url(/redesign/sprites/sable/idle.png)}.s-dirge{background-image:url(/redesign/sprites/dirge/idle.png)}.s-slime{background-image:url(/redesign/sprites/slime/idle.png)}.s-goblin{background-image:url(/redesign/sprites/goblin/idle.png)}
.lay{position:absolute;left:0;top:0;width:100%;height:390px;background-repeat:repeat-x;background-size:auto 390px;image-rendering:pixelated}
.l-sky{background-image:url(/redesign/bg/grassland/sky.png)}.l-clouds{background-image:url(/redesign/bg/grassland/clouds.png)}.l-mtn{background-image:url(/redesign/bg/grassland/mountains.png)}.l-hills{background-image:url(/redesign/bg/grassland/hills.png)}.l-meadow{background-image:url(/redesign/bg/grassland/meadow.png)}
.l-wall{background-image:url(/redesign/bg/dungeon/wall.png)}.l-light{background-image:url(/redesign/bg/dungeon/torchlight.png)}.l-floor{background-image:url(/redesign/bg/dungeon/floor.png)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;box-sizing:border-box;background:rgba(26,22,38,0.94);border:2px solid #4a4058;color:#efe9f5;font-family:'Do Hyeon',sans-serif;font-size:18px;text-decoration:none;cursor:pointer}
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;box-sizing:border-box;background:#f4d470;color:#1d1408;border:3px solid #2a1c10;box-shadow:0 4px 0 #7a5418;font-family:'Do Hyeon',sans-serif;font-size:20px;text-decoration:none;cursor:pointer}
.px{font-family:'Silkscreen',monospace}
.safe{position:absolute;top:0;bottom:0;width:44px;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,90,90,0.0) 0 6px,rgba(255,90,90,0.0) 6px 12px)}
.phone{position:absolute;left:38px;top:22px;width:44px;height:76px;box-sizing:border-box;border:4px solid #f4d470;border-radius:8px;background:#1a1626;animation:tilt 2.4s ease-in-out infinite}
.phone .scr{position:absolute;left:4px;right:4px;top:6px;bottom:10px;background:linear-gradient(180deg,#5fb4ec 0%,#4a9a44 100%)}
@keyframes tilt{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.arc{position:absolute;left:4px;top:4px;width:112px;height:112px;box-sizing:border-box;border-radius:50%;border:3px dashed rgba(244,212,112,0.35);border-left-color:transparent;border-bottom-color:transparent}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0c0a12; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px">
  <p class="px" style="margin: 0; font-size: 34px; font-weight: 700; line-height: 0.95; text-align: center; color: #fff6dc; text-shadow: 0 4px 0 #7a5418, 0 8px 0 #2a1c10">GRID<br>BRAWL</p>
  <div class="rot" aria-hidden="true" style="position: relative; width: 120px; height: 120px">
    <div class="phone"><span class="scr"></span></div>
    <span class="arc"></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; padding: 0 32px">
    <b style="font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 28px; color: #fff6dc">휴대폰을 가로로 돌려 주세요</b>
    <span style="font-size: 14px; line-height: 1.6; color: #c9c2d6">GridBrawl은 가로 화면 전용입니다.<br>6×4 전투판과 카드 세 장이 한눈에 보여야 해요.</span>
  </div>
  <span class="px" style="position: absolute; bottom: 34px; font-size: 11px; letter-spacing: 3px; color: #6a6478">ROTATE TO PLAY</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
