<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대장간</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}a:hover{color:#fff1b8}
.bg{position:absolute;inset:0;background-image:url(/redesign/cutscene/smith/smith-bg.png);background-size:1280px 720px;background-repeat:no-repeat}
.coin{background-image:url(/redesign/ui/map-icons/merchant.png);background-size:16px 14px;background-position:center;background-repeat:no-repeat;image-rendering:pixelated;width:16px;height:16px;flex-shrink:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:10px 18px;box-sizing:border-box;background:rgba(20,14,12,0.88);border:2px solid #6a4a30;box-shadow:0 4px 0 rgba(0,0,0,0.45);color:#fff6dc;font:inherit;text-align:left;cursor:pointer;text-decoration:none}
.opt:hover{border-color:#f4d470;background:rgba(42,28,16,0.94);transform:translateX(-4px)}
.opt-off{opacity:.45;cursor:not-allowed}
.opt-off:hover{transform:none;border-color:#6a4a30;background:rgba(20,14,12,0.88)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:3px 10px;font-family:'Silkscreen','Noto Sans KR',monospace;white-space:nowrap;background:#2a1c08;color:#ffd86a;border:1px solid #c9952f}
.fbtn{height:28px;padding:0 10px;background:rgba(18,15,26,0.85);border:2px solid #4a4058;color:#c9c2d6;font:inherit;font-size:12px;cursor:pointer}
.p0 .type{animation:ty0 1.4s steps(30) both}.p1 .type{animation:ty1 1.4s steps(30) both}
@keyframes ty0{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}@keyframes ty1{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.p0 .inR{animation:ir0 .45s ease-out both}.p1 .inR{animation:ir1 .45s ease-out both}
@keyframes ir0{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes ir1{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.d1{animation-delay:.15s!important}.d2{animation-delay:.3s!important}.d3{animation-delay:.45s!important}
.next{animation:nx .8s ease-in-out infinite}@keyframes nx{50%{transform:translateY(4px)}}
</style>
</helmet>
<div class="{{pk}}" style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #14100c; font-family: 'Noto Sans KR', sans-serif; color: #fff6dc">
  <div class="bg" role="img" aria-label="대장간 — 망치를 멘 대장장이가 손을 흔든다"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,6,4,0.72) 0%, rgba(10,6,4,0) 16%)"></div>
  <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; right: 0; width: 760px; background: linear-gradient(90deg, rgba(10,6,4,0) 0%, rgba(10,6,4,0.4) 42%)"></div>

  <header style="position: absolute; left: 32px; right: 32px; top: 18px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 12px; align-items: baseline"><h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 42px; text-shadow: 3px 3px 0 #0a0604">대장간</h1><span style="font-size: 14px; color: #ffd8a8; text-shadow: 2px 2px 0 #0a0604">초원 · 5층</span></div>
    <div style="display: flex; gap: 8px; align-items: center">
      <button type="button" class="fbtn" onClick="{{togglePoor}}">{{poorLabel}}</button>
      <span style="display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: rgba(42,28,8,0.92); border: 2px solid #c9952f"><span class="coin" aria-hidden="true"></span><span style="font-family: 'Silkscreen', monospace; font-size: 17px; color: #ffd86a">{{gold}}</span></span>
      <span style="padding: 8px 12px; background: rgba(18,15,26,0.92); border: 2px solid #4a4058; font-family: 'Silkscreen', monospace; font-size: 15px; color: #ffb0b0">HP {{hp}}/{{maxHp}}</span>
    </div>
  </header>

  <section style="position: absolute; left: 600px; top: 236px; width: 644px; box-sizing: border-box; padding: 30px 24px 22px; background: rgba(16,10,8,0.92); border: 3px solid #0a0604; box-shadow: inset 0 0 0 2px #ff8a3a, 0 8px 0 rgba(0,0,0,0.4)">
    <span aria-hidden="true" style="position: absolute; left: -24px; top: 44px; width: 0; height: 0; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-right: 22px solid #ff8a3a"></span>
    <div style="position: absolute; left: 18px; top: -22px; display: flex; box-shadow: 0 4px 0 rgba(0,0,0,0.4)">
      <span style="padding: 4px 14px; background: #5a3018; border: 3px solid #0a0604; font-family: 'Do Hyeon', sans-serif; font-size: 22px">대장장이</span>
      <span style="padding: 4px 10px; background: #0a0604; border: 3px solid #0a0604; border-left: 0; font-size: 12px; color: #ff8a3a; display: flex; align-items: center">대장간 주인</span>
    </div>
    <p class="type" style="margin: 0; font-size: 19px; line-height: 1.6">{{line}}</p>
    <span class="next" aria-hidden="true" style="position: absolute; right: 14px; bottom: 8px; color: #ff8a3a">▼</span>
  </section>

  <nav style="position: absolute; left: 600px; bottom: 30px; width: 644px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
      <a href="{{c.href}}" class="opt inR {{c.d}} {{c.cls}}" onClick="{{c.onTap}}">
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
          <span style="font-family: 'Do Hyeon', sans-serif; font-size: 26px">{{c.label}}</span>
          <span style="font-size: 13px; color: {{c.subFg}}">{{c.sub}}</span>
        </span>
        <span class="chip" style="display: {{c.chipD}}"><span class="coin" aria-hidden="true"></span>{{c.cost}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hp: 70, maxHp: 103, gold: 140 };
  }
  renderVals() {
    const st = this.state;
    // 2026-11-12 사용자 지정 — 선택지 셋, 강화는 한 번 · 한 장(저장하면 바로 지도로). 옛 "쉬어 간다"(10% 회복)는 없앴다.
    //   강화 맡기기 80G — 맡긴 판(수치 +5~+30 · 범위 1~5칸, 반드시 오른다)
    //   직접 강화 무료 — 직접 판(수치 −10~+20 · 범위 −2~+3칸, 그대로거나 나빠질 수도)
    //   나가기 — 아무것도 없이 다음 층
    // 룰렛 화면은 Upgrade.dc.html(위쪽 "시안용 판" 버튼으로 맡기기 / 직접을 바꿔 본다).
    const COST = 80;
    const can = st.gold >= COST;
    const line = `"어이, 어서 오게! ${COST}골드면 내가 제대로 두들겨 주지. 돈이 아까우면 망치를 빌려줄 테니 직접 해 보든가 — 망쳐도 난 모르네!"`;
    const choices = [
      { label: '강화 맡기기', sub: can ? '대장장이가 두들긴다 · 반드시 오른다 · 카드 한 장' : '골드가 모자란다', subFg: can ? '#ffd8a8' : '#b9a89a', chipD: 'inline-flex', cost: String(COST), href: can ? 'Upgrade.dc.html' : '#', cls: can ? '' : 'opt-off', d: 'd1', onTap: () => {} },
      { label: '직접 강화', sub: '공짜 · 대신 그대로거나 오히려 나빠질 수도 있다 · 카드 한 장', subFg: '#ffd8a8', chipD: 'none', cost: '', href: 'Upgrade.dc.html', cls: '', d: 'd2', onTap: () => {} },
      { label: '나가기', sub: '아무것도 하지 않고 다음 층으로', subFg: '#ffd8a8', chipD: 'none', cost: '', href: 'RunMap.dc.html', cls: '', d: 'd3', onTap: () => {} },
    ];
    return {
      pk: 'p0', gold: String(st.gold), hp: String(st.hp), maxHp: String(st.maxHp), line, choices,
      poorLabel: can ? '골드 부족 보기(시안)' : '골드 되돌리기(시안)',
      togglePoor: () => this.setState({ gold: can ? 50 : 140 }),
    };
  }
}
</script>
</body>
</html>
