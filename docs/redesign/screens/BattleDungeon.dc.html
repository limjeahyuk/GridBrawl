<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전투 — 던전</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}a:hover{color:#fff1b8}
.layer{position:absolute;left:0;top:0;width:1280px;height:720px;background-repeat:repeat-x;background-size:1280px 720px;image-rendering:pixelated}
.l-wall{background-image:url(/redesign/bg/dungeon/wall.png)}
.l-light{background-image:url(/redesign/bg/dungeon/torchlight.png);animation:flicker 1.6s steps(3) infinite}
.l-floor{background-image:url(/redesign/bg/dungeon/floor.png)}
.l-fg{background-image:url(/redesign/bg/dungeon/foreground.png)}
@keyframes flicker{0%{opacity:1}50%{opacity:0.82}100%{opacity:1}}
.torch{position:absolute;width:64px;height:112px;background-image:url(/redesign/bg/dungeon/torch.png);background-size:256px 112px;image-rendering:pixelated;animation:f4 480ms steps(4) infinite}
.board{background-image:url(/redesign/terrain/dungeon-tile.png);background-size:64px 64px;image-rendering:pixelated}
.spr{image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation-iteration-count:infinite}
.n6{animation-name:f6;animation-timing-function:steps(6)}
.n7{animation-name:f7;animation-timing-function:steps(7)}
@keyframes f4{to{background-position:133.3333% 0}}
@keyframes f6{to{background-position:120% 0}}
@keyframes f7{to{background-position:116.6667% 0}}
.s-sable-a1{background-image:url(/redesign/sprites/sable/attack1.png)}
.s-sable-idle{background-image:url(/redesign/sprites/sable/idle.png)}
.s-golem-idle{background-image:url(/redesign/sprites/golem/idle.png)}
.hz{position:absolute;width:128px;height:128px;image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;pointer-events:none}
.hz-pillar{background-image:url(/redesign/terrain/hazards/rock-pillar.png);background-size:768px 128px;filter:drop-shadow(0 3px 2px rgba(0,0,0,0.7))}
.hz-spikes{background-image:url(/redesign/terrain/hazards/spikes.png);background-size:768px 128px;animation:f6 1080ms steps(6) infinite}
.hz-fog{background-image:url(/redesign/terrain/hazards/fog.png);background-size:768px 128px;animation:f6 780ms steps(6) infinite;opacity:0.9}
.cell-n{background:rgba(0,0,0,0.12)}
.cell-me{background:rgba(255,138,58,0.34);box-shadow:inset 0 0 0 2px #ffc07a}
.cell-foe{background:rgba(94,240,255,0.26);box-shadow:inset 0 0 0 2px #5ef0ff}
.boot{background-image:url(/redesign/ui/move/boot.png);background-size:28px 28px;width:28px;height:28px;image-rendering:pixelated;flex-shrink:0}
.bd{position:relative;width:112px;height:120px;flex-shrink:0}
.bd .b2,.bd .b1{position:absolute;left:0;right:0;height:110px;background:#10203a;border:2px solid #2a4a78;box-sizing:border-box}
.bd .b2{top:0;transform:translateX(4px)}
.bd .b1{top:5px;transform:translateX(2px)}
.bd .f{position:absolute;left:0;right:0;bottom:0;height:110px;box-sizing:border-box;padding:6px 7px;background:#14243a;border:2px solid #5aa8ff;box-shadow:inset 0 0 0 2px #0a1424;display:flex;flex-direction:column;gap:5px}
.cmp{display:grid;grid-template-columns:repeat(3,14px);gap:2px}
.cmp span{width:14px;height:14px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-size:9px;display:flex;align-items:center;justify-content:center;color:#b9b1c9}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0c0a12; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5">
  <div class="layer l-wall" aria-hidden="true"></div>
  <div class="layer l-light" aria-hidden="true"></div>
  <div class="torch" aria-hidden="true" style="left: 376px; top: 224px"></div>
  <div class="torch" aria-hidden="true" style="left: 520px; top: 224px"></div>
  <div class="torch" aria-hidden="true" style="left: 1016px; top: 224px"></div>
  <div class="torch" aria-hidden="true" style="left: 1160px; top: 224px"></div>
  <div class="layer l-floor" aria-hidden="true"></div>

  <header style="position: absolute; left: 24px; right: 24px; top: 16px; height: 84px; display: grid; grid-template-columns: 1fr 220px 1fr; gap: 16px">
    <div style="display: flex; gap: 12px; padding: 10px 14px; background: rgba(18,15,26,0.92); border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px #c4501c">
      <div aria-hidden="true" style="width: 58px; height: 58px; background: #2a160e; border: 2px solid #c4501c; overflow: hidden; position: relative">
        <div class="spr n6 s-sable-idle" style="position: absolute; left: -44px; top: -26px; width: 192px; height: 128px; background-size: 1152px 128px; animation-duration: 750ms"></div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between"><span style="font-family: 'Silkscreen', monospace; font-size: 18px; color: #fff6dc">SABLE</span><span style="font-size: 12px; color: #ffd0a0">독니 +3 · 중독</span></div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #ff8a8a">HP</span><div style="flex-grow: 1; height: 12px; background: #0a0810; border: 2px solid #3a3150"><div style="width: 62%; height: 100%; background: #e0485a; box-shadow: inset 0 -3px 0 #a02a3a"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px; text-align: right">50/81</span></div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #7fc8ff">EN</span><div style="flex-grow: 1; height: 8px; background: #0a0810; border: 2px solid #3a3150"><div style="width: 70%; height: 100%; background: #4a9aff"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px; text-align: right">35</span></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(18,15,26,0.92); border: 3px solid #0a0810">
      <span style="font-family: 'Silkscreen', monospace; font-size: 26px; color: #f4d470">ROUND 5</span>
      <span style="font-size: 13px; color: #c9c4ee">던전 · 11층 · 실행 중</span>
    </div>
    <div style="display: flex; gap: 12px; padding: 10px 14px; background: rgba(18,15,26,0.92); border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px #5ef0ff; flex-direction: row-reverse">
      <div aria-hidden="true" style="width: 58px; height: 58px; background: #14202a; border: 2px solid #5ef0ff; overflow: hidden; position: relative">
        <div class="spr n6 s-golem-idle" style="position: absolute; left: -64px; top: -48px; width: 240px; height: 184px; background-size: 1440px 184px; animation-duration: 900ms; transform: scaleX(-1)"></div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; flex-direction: row-reverse; align-items: center"><span style="display: flex; gap: 8px; align-items: center"><span style="font-family: 'Silkscreen', monospace; font-size: 10px; padding: 2px 6px; background: #ff8a3a; color: #1d1408">ELITE</span><span style="font-family: 'Do Hyeon', sans-serif; font-size: 20px; color: #fff6dc">골렘</span></span><span style="font-size: 12px; color: #a8f6ff">룬 코어 충전 중</span></div>
        <div style="display: flex; align-items: center; gap: 8px; flex-direction: row-reverse"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #ff8a8a">HP</span><div style="flex-grow: 1; height: 12px; background: #0a0810; border: 2px solid #3a3150; display: flex; justify-content: flex-end"><div style="width: 55%; height: 100%; background: #e0485a; box-shadow: inset 0 -3px 0 #a02a3a"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px">44/80</span></div>
        <div style="display: flex; align-items: center; gap: 8px; flex-direction: row-reverse"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #7fc8ff">EN</span><div style="flex-grow: 1; height: 8px; background: #0a0810; border: 2px solid #3a3150; display: flex; justify-content: flex-end"><div style="width: 40%; height: 100%; background: #4a9aff"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px">16</span></div>
      </div>
    </div>
  </header>

  <div class="board" aria-label="6×4 전투판" style="position: absolute; left: 160px; top: 300px; width: 960px; height: 272px; border: 4px solid #0a0810; box-shadow: 0 0 0 2px #4a4566, 0 10px 0 #15131c; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, 68px)">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="24">
      <div class="{{c.cls}}" style="border-right: 1px solid rgba(0,0,0,0.4); border-bottom: 1px solid rgba(0,0,0,0.4)"></div>
    </sc-for>
  </div>

  <div class="hz hz-pillar" role="img" aria-label="돌기둥" style="left: 816px; top: 257px"></div>
  <div class="hz hz-spikes" role="img" aria-label="가시덫" style="left: 496px; top: 393px"></div>
  <div aria-hidden="true" style="position: absolute; left: 196px; top: 414px; width: 90px; height: 14px; border-radius: 50%; background: rgba(0,0,0,0.45)"></div>
  <div class="spr n7 s-sable-a1" role="img" aria-label="SABLE 사격 모션" style="position: absolute; left: 170px; top: 300px; width: 192px; height: 128px; background-size: 1344px 128px; animation-duration: 1100ms"></div>
  <div aria-hidden="true" style="position: absolute; left: 820px; top: 478px; width: 130px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.45)"></div>
  <div class="spr n6 s-golem-idle" role="img" aria-label="골렘" style="position: absolute; left: 736px; top: 308px; width: 240px; height: 184px; background-size: 1440px 184px; animation-duration: 900ms; transform: scaleX(-1)"></div>

  <div class="hz hz-fog" role="img" aria-label="독안개" style="left: 336px; top: 461px"></div>
  <div class="hz hz-fog" role="img" aria-label="독안개" style="left: 496px; top: 461px; animation-delay: -260ms"></div>
  <div class="layer l-fg" aria-hidden="true"></div>

  <div style="position: absolute; left: 470px; top: 232px; padding: 8px 18px; background: rgba(18,15,26,0.94); border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px #ff8a3a; display: flex; gap: 12px; align-items: center">
    <span style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #ffa24a">CARD 2/3</span>
    <span style="font-family: 'Do Hyeon', sans-serif; font-size: 22px">잿빛 화살</span>
    <span style="font-size: 12px; color: #c9c2d6">앞뒤 1~2칸 + 대각 · 12</span>
  </div>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 136px; background: linear-gradient(180deg, rgba(12,10,18,0) 0%, rgba(12,10,18,0.94) 22%); display: flex; align-items: flex-end; gap: 16px; padding: 0 24px 12px; box-sizing: border-box">
    <div style="display: flex; gap: 8px; padding: 8px; background: #120f1a; border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px #ff8a3a">
      <sc-for list="{{slots}}" as="k" hint-placeholder-count="3">
        <div style="position: relative; width: 96px; height: 106px; box-sizing: border-box; padding: 6px; display: flex; flex-direction: column; gap: 5px; background: {{k.bg}}; border: 2px solid {{k.edge}}; opacity: {{k.op}}">
          <span style="position: absolute; left: -2px; top: -12px; font-family: 'Silkscreen', monospace; font-size: 12px; padding: 1px 6px; background: {{k.tag}}; color: #1d1408">{{k.order}}</span>
          <div style="display: {{k.dMove}}; flex-direction: column; align-items: center; gap: 2px; height: 100%">
            <span style="align-self: stretch; display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 10px; margin-top: 4px"><span style="color: #8ad0ff">MOVE</span><span style="color: #b9b1c9">EN0</span></span>
            <span style="font-size: 32px; line-height: 40px; font-weight: 700; color: #8ad0ff">{{k.glyph}}</span>
            <span style="margin-top: auto; font-family: 'Do Hyeon', sans-serif; font-size: 15px">{{k.name}}</span>
          </div>
          <div style="display: {{k.dCard}}; flex-direction: column; gap: 5px; height: 100%">
            <div style="display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 10px; margin-top: 4px"><span style="color: #ff9a9a">{{k.dm}}</span><span style="color: #8ad0ff">{{k.en}}</span></div>
            <div style="display: grid; grid-template-columns: repeat(3, 12px); gap: 2px; justify-content: center">
              <sc-for list="{{k.grid}}" as="g" hint-placeholder-count="9"><div style="width: 12px; height: 12px; background: {{g}}"></div></sc-for>
            </div>
            <span style="font-family: 'Do Hyeon', sans-serif; font-size: 15px; text-align: center; margin-top: auto">{{k.name}}</span>
          </div>
        </div>
      </sc-for>
    </div>
    <div class="bd" role="img" aria-label="이동 카드 묶음 5장" style="opacity: 0.5">
      <span class="b2"></span><span class="b1"></span>
      <span class="f">
        <span style="display: flex; align-items: center; gap: 4px"><span class="boot" aria-hidden="true"></span><span style="display: flex; flex-direction: column; line-height: 1.05"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #8ad0ff">MOVE</span><span style="font-family: 'Silkscreen', monospace; font-size: 15px; color: #fff6dc">×5</span></span></span>
        <span style="display: flex; gap: 6px; align-items: center">
          <span class="cmp" aria-hidden="true"><sc-for list="{{compass}}" as="q" hint-placeholder-count="9"><span style="background: {{q.bg}}; box-shadow: {{q.sh}}">{{q.t}}</span></sc-for></span>
          <span style="display: flex; flex-direction: column; gap: 2px; font-size: 10px; line-height: 1.3; color: #c9c2d6"><span>준비 <b style="color: #b6ea6a">4</b></span><span>쿨 <b>1</b></span></span>
        </span>
        <span style="margin-top: auto; font-size: 11px; color: #b9b1c9; text-align: center">재생 중</span>
      </span>
    </div>
    <div style="display: flex; gap: 8px; flex-grow: 1; opacity: 0.5">
      <sc-for list="{{hand}}" as="k" hint-placeholder-count="5">
        <div style="width: 96px; height: 106px; box-sizing: border-box; padding: 6px; display: flex; flex-direction: column; gap: 5px; background: {{k.bg}}; border: 2px solid {{k.edge}}">
          <div style="display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 10px"><span style="color: #ff9a9a">{{k.dm}}</span><span style="color: #8ad0ff">{{k.en}}</span></div>
          <div style="display: grid; grid-template-columns: repeat(3, 12px); gap: 2px; justify-content: center">
            <sc-for list="{{k.grid}}" as="g" hint-placeholder-count="9"><div style="width: 12px; height: 12px; background: {{g}}"></div></sc-for>
          </div>
          <span style="font-family: 'Do Hyeon', sans-serif; font-size: 15px; text-align: center; margin-top: auto">{{k.name}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-bottom: 6px">
      <span style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #c9c2d6">RESOLVING</span>
      <span style="font-family: 'Do Hyeon', sans-serif; font-size: 20px; color: #ffa24a">이동 → 수비 → 공격</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const E = '#2a2438', S = '#f4d470', H = '#e0485a', M = '#5aa8ff';
    const atk = (name, dm, en, grid, sig) => ({ name, dm: 'DM' + dm, en: 'EN' + en, grid, bg: sig ? '#163024' : '#2a1620', edge: sig ? '#3cbf7a' : '#8a3040', op: 1, tag: '#ffa24a', dMove: 'none', dCard: 'flex', glyph: '' });
    const fork = [H, E, H, H, S, H, H, E, H];
    const slots = [
      { order: '1', name: '아래', glyph: '↓', bg: '#14243a', edge: '#5aa8ff', op: 0.45, tag: '#ffa24a', dMove: 'flex', dCard: 'none', grid: [] },
      Object.assign(atk('잿빛 화살', 12, 8, fork), { order: '2', edge: '#ffc07a' }),
      Object.assign(atk('독니 화살', 11, 10, [E, E, E, E, S, H, E, E, E]), { order: '3' }),
    ];
    const hand = [
      atk('말뚝 화살', 14, 16, [E, E, E, H, S, H, E, E, E]),
      atk('물러서며 쏘기', 11, 10, fork),
      atk('독의 비', 20, 23, [E, E, H, E, S, H, E, E, H], true),
      { name: '가드', dm: 'BLOCK', en: 'EN6', grid: [E, E, E, E, '#7fd6c8', E, E, E, E], bg: '#122a2a', edge: '#3c9c98' },
    ];
    const q = (bg, t = '') => ({ bg, sh: 'none', t });
    const compass = [q('#1a1626'), q('#5aa8ff'), q('#1a1626'), q('#2a2438', '1'), { bg: S, sh: 'inset 0 0 0 2px #7a5418', t: '' }, q('#5aa8ff'), q('#1a1626'), q('#7a5418'), q('#1a1626')];
    // SABLE at (0,1) after moving down → shot covers row 1 cols 1-2 + diagonals
    const cells = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
      let cls = 'cell-n';
      if (r === 1 && (c === 1 || c === 2)) cls = 'cell-me';
      if ((r === 0 || r === 2) && c === 1) cls = 'cell-me';
      if ((r === 1 || r === 2 || r === 3) && c === 3) cls = 'cell-foe';
      cells.push({ cls });
    }
    return { slots, hand, cells, compass };
  }
}
</script>
</body>
</html>
