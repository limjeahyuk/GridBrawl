<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>휴식 — 모닥불</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}a:hover{color:#fff1b8}
.layer{position:absolute;left:0;top:0;width:1280px;height:720px;background-repeat:repeat-x;background-size:1280px 720px;image-rendering:pixelated}
.l-sky{background-image:url(/redesign/bg/grassland/sky.png)}
.l-hills{background-image:url(/redesign/bg/grassland/hills.png)}
.l-meadow{background-image:url(/redesign/bg/grassland/meadow.png)}
.fire{background-image:url(/redesign/ui/rest/campfire.png);background-size:1440px 216px;width:240px;height:216px;image-rendering:pixelated;animation:f6 600ms steps(6) infinite}
@keyframes f6{to{background-position:120% 0}}
.glow{background-image:url(/redesign/ui/rest/campfire-glow.png);background-size:720px 432px;width:720px;height:432px;image-rendering:pixelated;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.75}}
.spr{image-rendering:pixelated;background-repeat:no-repeat;animation:f6 720ms steps(6) infinite}
.s-cairn-idle{background-image:url(/redesign/sprites/cairn/idle.png)}
.anvil{background-image:url(/redesign/ui/rest/anvil.png);background-size:54px 48px;width:54px;height:48px;image-rendering:pixelated}
.opt{width:380px;height:250px;box-sizing:border-box;padding:22px;display:flex;flex-direction:column;gap:12px;background:#1a1626;border:3px solid #4a4058;color:#efe9f5;font:inherit;text-align:left;cursor:pointer;text-decoration:none}
.opt:hover{border-color:#f4d470;background:#221c30;transform:translateY(-4px)}
.chip{font-size:12px;padding:2px 8px;font-family:'Silkscreen','Noto Sans KR',monospace}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1a2440; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5">
  <div class="layer l-sky" aria-hidden="true" style="filter: brightness(0.35) saturate(0.7) hue-rotate(200deg)"></div>
  <div class="layer l-hills" aria-hidden="true" style="filter: brightness(0.35) saturate(0.6)"></div>
  <div class="layer l-meadow" aria-hidden="true" style="filter: brightness(0.4) saturate(0.6)"></div>
  <div class="glow" aria-hidden="true" style="position: absolute; left: 0; top: 180px; mix-blend-mode: screen"></div>
  <div class="fire" role="img" aria-label="모닥불" style="position: absolute; left: 240px; top: 340px"></div>
  <div class="spr s-cairn-idle" role="img" aria-label="CAIRN" style="position: absolute; left: 40px; top: 410px; width: 192px; height: 128px; background-size: 1152px 128px"></div>

  <header style="position: absolute; left: 32px; right: 32px; top: 22px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 12px; align-items: baseline"><h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 40px; color: #fff6dc">모닥불</h1><span style="font-size: 14px; color: #b6ea6a">초원 · 4층 · 휴식</span></div>
    <span style="padding: 8px 14px; background: rgba(18,15,26,0.9); border: 2px solid #4a4058; font-family: 'Silkscreen', monospace; font-size: 14px; color: #ffb0b0">HP 58/103</span>
  </header>

  <section style="position: absolute; left: 520px; top: 130px; display: flex; flex-direction: column; gap: 18px">
    <p style="margin: 0; font-size: 16px; color: #e4def0">불가에서 할 수 있는 건 <b style="color: #ffd86a">하나뿐</b>이다.</p>
    <div style="display: flex; gap: 20px">
      <button type="button" class="opt">
        <span style="font-family: 'Silkscreen', monospace; font-size: 12px; letter-spacing: 3px; color: #ff9a9a">REST</span>
        <b style="font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 34px">쉰다</b>
        <span style="font-size: 14px; line-height: 1.6; color: #e4def0">따뜻한 불 옆에서 눈을 붙인다.</span>
        <div style="display: flex; gap: 6px; margin-top: auto"><span class="chip" style="background: #3a1016; color: #ff9a9a; border: 1px solid #e0485a">HP +30 (최대의 30%)</span><span class="chip" style="background: #1a1626; color: #c9c2d6; border: 1px solid #4a4058">58 → 88</span></div>
      </button>
      <a href="Upgrade.dc.html" class="opt">
        <span style="display: flex; justify-content: space-between; align-items: flex-start"><span style="font-family: 'Silkscreen', monospace; font-size: 12px; letter-spacing: 3px; color: #ffd86a">UPGRADE</span><span class="anvil" aria-hidden="true"></span></span>
        <b style="font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 34px; margin-top: -18px">카드를 벼린다</b>
        <span style="font-size: 14px; line-height: 1.6; color: #e4def0">카드 한 장 · 공격력 또는 범위 · 룰렛 0~5.</span>
        <div style="display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap"><span class="chip" style="background: #2a1c08; color: #ffd86a; border: 1px solid #c9952f">피해 +0~5</span><span class="chip" style="background: #2a1608; color: #ffb07a; border: 1px solid #ff9a3a">범위 +0~5칸</span><span class="chip" style="background: #1a1626; color: #c9c2d6; border: 1px solid #4a4058">0 = 꽝 10%</span></div>
      </a>
    </div>
    <span style="font-size: 12px; color: #b9b1c9">상점에서는 마렌에게 50골드를 내고 같은 강화를 할 수 있다(상점마다 한 번).</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
