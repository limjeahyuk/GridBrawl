<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이벤트 일러스트 시안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.eb-forge{background-image:url(/redesign/cutscene/events/forge.png)}
.eb-spring{background-image:url(/redesign/cutscene/events/spring.png)}
.eb-trade{background-image:url(/redesign/cutscene/events/trade.png)}
.shot{position:relative;width:1280px;height:720px;background-size:1280px 720px;background-repeat:no-repeat;overflow:hidden;box-shadow:0 0 0 3px #3a3150;color:#efe9f5}
.opt{display:flex;align-items:center;gap:10px;padding:14px 16px;box-sizing:border-box;background:#1a1626;border:2px solid #4a4058}
.opt-lock{border-style:dashed;background:repeating-linear-gradient(135deg,#17131f 0 8px,#1d1828 8px 16px);color:#8a849a}
.chip{font-size:12px;padding:2px 8px;font-family:'Silkscreen','Noto Sans KR',monospace;white-space:nowrap;background:#1a1626;color:#c9c2d6;border:1px solid #4a4058}
</style>
</helmet>
<div style="width: 4000px; height: 900px; box-sizing: border-box; padding: 30px 40px; background: #120f1a; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5; display: flex; flex-direction: column; gap: 18px">
  <header>
    <h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 38px; color: #fff6dc">? 이벤트 일러스트 시안 — 낡은 대장간 · 거래 · 온천</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #c9c2d6">그림을 화면 전체 배경으로 깔고, 이벤트 이름 · 글 · 선택지를 오른쪽 패널에 올린다. 선택지에는 대가만 보이고 결과는 고른 뒤에 나온다. 직접 눌러 보려면 "? 이벤트 8종" 보드의 탭.</p>
  </header>
  <div style="display: flex; gap: 40px">
    <sc-for list="{{evs}}" as="e" hint-placeholder-count="3">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
        <div class="shot {{e.cls}}" role="img" aria-label="{{e.name}}">
          <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,6,12,0.78) 0%, rgba(8,6,12,0) 20%)"></div>
          <div style="position: absolute; top: 0; bottom: 0; right: 0; width: 820px; background: linear-gradient(90deg, rgba(8,6,12,0) 0%, rgba(8,6,12,0.55) 40%)"></div>
          <span style="position: absolute; left: 32px; top: 16px; font-family: 'Do Hyeon', sans-serif; font-size: 34px; color: #fff6dc">? 칸 · 이벤트</span>
          <div style="position: absolute; left: 600px; top: 116px; width: 644px; box-sizing: border-box; padding: 18px 22px 20px; background: rgba(16,10,8,0.88); border: 3px solid #0a0604; box-shadow: inset 0 0 0 2px {{e.col}}, 0 8px 0 rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Silkscreen', monospace; font-size: 13px; letter-spacing: 4px; color: {{e.col}}">EVENT · 한 번</span>
            <b style="font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 40px; color: #fff6dc">{{e.name}}</b>
            <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #e4def0; white-space: pre-line">{{e.text}}</p>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px">
              <sc-for list="{{e.choices}}" as="c" hint-placeholder-count="3">
                <div class="opt {{c.cls}}"><span style="font-family: 'Do Hyeon', sans-serif; font-size: 23px; flex-grow: 1">{{c.label}}</span><span class="chip" style="display: {{c.chipD}}">{{c.chip}}</span></div>
              </sc-for>
            </div>
          </div>
        </div>
        <figcaption style="display: flex; gap: 10px; align-items: baseline"><b style="font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 26px; color: #fff6dc">{{e.name}}</b><span style="font-size: 13px; color: #c9c2d6">{{e.src}}</span></figcaption>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4000,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (label, chip, cls) => ({ label, chip: chip || '', chipD: chip ? 'inline-block' : 'none', cls: cls || '' });
    const evs = [
      { cls: 'eb-forge', name: '빈 대장간', col: '#ff8a5a', src: '대장간.png', text: '빈 대장간을 발견했다.\n신기하게 불은 꺼질 생각을 하지 않는다.',
        choices: [c('카드라도 두들긴다'), c('주변에 쇠라도 챙긴다'), c('??? — 잠겨 있다 · 무언가 필요해 보인다', '', 'opt-lock')] },
      { cls: 'eb-trade', name: '거래', col: '#c48aff', src: '거래상.png', text: '"그 물건 탐나는군요. 저와 거래하실래요?"\n누군가가 거래를 요청했다.',
        choices: [c('내 카드 한 장 ↔ 다른 카드', '카드 1장'), c('내 카드 한 장 ↔ 유물', '카드 1장'), c('내 유물 하나 ↔ 다른 유물', '유물 1개')] },
      { cls: 'eb-spring', name: '온천', col: '#6ae0e0', src: '온천.png', text: '김이 모락모락 나는 아주 뜨끈한 온천을 발견했다.\n당장 쉬고 싶어진다.',
        choices: [c('휴식')] },
    ];
    return { evs };
  }
}
</script>
</body>
</html>
