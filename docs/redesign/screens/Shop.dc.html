<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상점 (여관)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}a:hover{color:#fff1b8}
.px{background-repeat:no-repeat;image-rendering:pixelated}
.bag{background-image:url(/redesign/ui/map-icons/merchant.png);background-size:168px 144px;background-position:center}
.coin{background-image:url(/redesign/ui/map-icons/merchant.png);background-size:20px 17px;background-position:center;width:20px;height:20px;flex-shrink:0}
.rf3{width:78px;height:78px;background-image:url(/redesign/ui/relics/atlas-full.png);background-size:780px 780px}
.item{position:relative;width:170px;height:250px;box-sizing:border-box;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(26,18,14,0.94);border:3px solid #5a3e2a;box-shadow:0 5px 0 rgba(0,0,0,0.45);color:#efe9f5;font:inherit;text-align:left;cursor:pointer}
.item:hover{border-color:#f4d470;transform:translateY(-4px)}
.item:disabled{cursor:not-allowed;transform:none}
.spr{image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation-iteration-count:infinite;animation-name:f6;animation-timing-function:steps(6)}
@keyframes f6{to{background-position:120% 0}}
.bg{position:absolute;inset:0;background-image:url(/redesign/cutscene/shopkeeper/shopkeeper.png);background-size:1700px auto;background-position:-420px -443px;background-repeat:no-repeat}
.price{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;margin-top:auto;background:#2a1c10;border:2px solid #c9952f;font-family:'Silkscreen',monospace;font-size:16px;color:#ffd86a}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1a100a; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5">
  <div class="bg" role="img" aria-label="여관 — 여관 주인 마렌"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,6,4,0.1) 0%, rgba(10,6,4,0.2) 38%, rgba(10,6,4,0.82) 52%, rgba(10,6,4,0.88) 100%)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,6,4,0.65) 0%, rgba(10,6,4,0) 16%)"></div>

  <header style="position: absolute; left: 32px; right: 32px; top: 20px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: baseline; gap: 12px"><h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 40px; color: #fff6dc; text-shadow: 3px 3px 0 #0a0604">상점</h1><span style="font-size: 14px; color: #ffd8a8; text-shadow: 2px 2px 0 #0a0604">여관 · 초원 4층</span></div>
    <div style="display: flex; gap: 12px; align-items: center">
      <span style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(42,28,8,0.92); border: 2px solid #c9952f"><span class="px coin" aria-hidden="true"></span><span style="font-family: 'Silkscreen', monospace; font-size: 20px; color: #ffd86a">96</span></span>
      <span style="padding: 8px 14px; background: rgba(18,15,26,0.9); border: 2px solid #4a4058; font-family: 'Silkscreen', monospace; font-size: 14px; color: #ffb0b0">HP 70/103</span>
      <a href="Inn.dc.html" style="padding: 9px 18px; background: rgba(20,14,12,0.9); border: 2px solid #6a4a30; font-family: 'Do Hyeon', sans-serif; font-size: 20px; color: #fff6dc; text-decoration: none">← 여관으로</a>
    </div>
  </header>

  <section style="position: absolute; left: 36px; bottom: 30px; width: 520px; box-sizing: border-box; padding: 26px 22px 16px; background: rgba(16,10,8,0.9); border: 3px solid #0a0604; box-shadow: inset 0 0 0 2px #c9952f, 0 8px 0 rgba(0,0,0,0.4)">
    <span style="position: absolute; left: 18px; top: -20px; padding: 3px 14px; background: #7a2a1a; border: 3px solid #0a0604; font-family: 'Do Hyeon', sans-serif; font-size: 21px; color: #fff6dc">마렌</span>
    <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #fff6dc">"천천히 둘러보세요. 덱이 꽉 찼으면 한 장이랑 바꿔 드릴게요."</p>
  </section>

  <main style="position: absolute; left: 610px; top: 104px; right: 36px; display: flex; flex-direction: column; gap: 16px">
    <section aria-label="카드" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 24px; color: #fff6dc">카드 <span style="font-size: 13px; color: #d8c8b8">· 한 장 35</span></h2>
      <div style="display: flex; gap: 14px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
          <button type="button" class="item" disabled="{{c.sold}}" style="opacity: {{c.op}}">
            <span style="position: absolute; left: 0; right: 0; top: 0; height: 6px; background: {{c.strip}}"></span>
            <span style="display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 11px; margin-top: 4px"><span style="color: #ff9a9a">{{c.dm}}</span><span style="color: #8ad0ff">{{c.en}}</span></span>
            <span style="font-family: 'Do Hyeon', sans-serif; font-size: 21px; color: #fff6dc">{{c.name}}</span>
            <span style="align-self: center; display: grid; grid-template-columns: repeat(3, 16px); gap: 3px"><sc-for list="{{c.grid}}" as="g" hint-placeholder-count="9"><span style="width: 16px; height: 16px; background: {{g}}"></span></sc-for></span>
            <span style="font-size: 12px; line-height: 1.5; color: #e4def0">{{c.desc}}</span>
            <span class="price"><span class="px coin" aria-hidden="true"></span>{{c.price}}</span>
          </button>
        </sc-for>
      </div>
    </section>
    <section aria-label="유물" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 24px; color: #fff6dc">유물 <span style="font-size: 13px; color: #d8c8b8">· 등급별 60 / 95 / 145 / 230</span></h2>
      <div style="display: flex; gap: 14px">
        <sc-for list="{{relics}}" as="r" hint-placeholder-count="2">
          <button type="button" class="item" style="width: 298px; height: 140px; flex-direction: row; align-items: center; gap: 12px; border-color: {{r.edge}}">
            <span class="px rf3" aria-hidden="true" style="background-position: {{r.pos}}; flex-shrink: 0"></span>
            <span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; height: 100%">
              <span style="display: flex; gap: 6px; align-items: center"><span style="font-family: 'Do Hyeon', sans-serif; font-size: 20px">{{r.name}}</span><span style="font-size: 11px; padding: 1px 6px; background: {{r.edge}}; color: {{r.tagFg}}">{{r.rarity}}</span></span>
              <span style="font-size: 12px; line-height: 1.5; color: #e4def0">{{r.desc}}</span>
              <span class="price"><span class="px coin" aria-hidden="true"></span>{{r.price}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const E = '#2a2438', S = '#f4d470', H = '#e0485a';
    const cards = [
      { name: '응보의 일격', dm: 'DM10', en: 'EN9', grid: [E, E, E, H, S, H, E, E, E], desc: '앞뒤 한 칸 · 보호막 +15.', price: '35', strip: '#8a3040', sold: false, op: 1 },
      { name: '대지 가르기', dm: 'DM14', en: 'EN12', grid: [H, E, H, H, S, H, H, E, H], desc: '세로 3줄 · 맞으면 기절.', price: '판매 완료', strip: '#8a3040', sold: true, op: 0.4 },
      { name: '방패 돌진', dm: 'DM15', en: 'EN13', grid: [E, E, E, H, S, H, E, E, E], desc: '두 칸 파고들며 훑는다 · 넉백.', price: '35', strip: '#8a3040', sold: false, op: 1 },
    ];
    const relics = [
      { name: '흡성의 룬', rarity: '희귀', edge: '#6ab8ff', tagFg: '#0c1e34', pos: '-468px -234px', desc: '공격으로 피해를 주면 체력 5 회복.', price: '95' },
      { name: '두꺼운 판금', rarity: '일반', edge: '#8a849a', tagFg: '#120f1a', pos: '-234px 0px', desc: '받는 피해 -3.', price: '60' },
    ];
    return { cards, relics };
  }
}
</script>
</body>
</html>
