<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대장장이</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}a:hover{color:#fff1b8}
.layer{position:absolute;left:0;top:0;width:1280px;height:720px;background-repeat:repeat-x;background-size:1280px 720px;image-rendering:pixelated}
.l-wall{background-image:url(/redesign/bg/dungeon/wall.png)}
.l-floor{background-image:url(/redesign/bg/dungeon/floor.png)}
.forge{background-image:url(/redesign/ui/events/forge.png);background-size:2688px 364px;width:448px;height:364px;image-rendering:pixelated;animation:f6 .66s steps(6) infinite}
@keyframes f6{to{background-position:120% 0}}
.coin{background-image:url(/redesign/ui/map-icons/merchant.png);background-size:16px 14px;background-position:center;background-repeat:no-repeat;image-rendering:pixelated;width:16px;height:16px;flex-shrink:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:10px 18px;box-sizing:border-box;background:rgba(20,14,12,0.88);border:2px solid #6a4a30;box-shadow:0 4px 0 rgba(0,0,0,0.45);color:#fff6dc;font:inherit;text-align:left;cursor:pointer;text-decoration:none}
.opt:hover{border-color:#f4d470;background:rgba(42,28,16,0.94);transform:translateX(-4px)}
.opt-off{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:3px 10px;font-family:'Silkscreen','Noto Sans KR',monospace;white-space:nowrap;background:#2a1c08;color:#ffd86a;border:1px solid #c9952f}
.glow{animation:gl 1.6s ease-in-out infinite}@keyframes gl{50%{opacity:.7}}
.type{animation:ty 1.4s steps(30) both}@keyframes ty{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.inR{animation:ir .45s ease-out both}@keyframes ir{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}
.next{animation:nx .8s ease-in-out infinite}@keyframes nx{50%{transform:translateY(4px)}}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0c0a12; font-family: 'Noto Sans KR', sans-serif; color: #fff6dc">
  <div class="layer l-wall" aria-hidden="true"></div>
  <div class="layer l-floor" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true" style="position: absolute; left: 60px; top: 120px; width: 700px; height: 560px; background: radial-gradient(ellipse at 45% 60%, rgba(255,138,58,0.55) 0%, rgba(255,138,58,0.15) 40%, rgba(0,0,0,0) 70%)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 35% 55%, rgba(0,0,0,0) 30%, rgba(8,4,4,0.75) 100%)"></div>
  <div class="forge" role="img" aria-label="꺼지지 않는 화덕과 모루" style="position: absolute; left: 150px; top: 150px"></div>

  <header style="position: absolute; left: 32px; right: 32px; top: 20px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 12px; align-items: baseline"><h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 42px; text-shadow: 3px 3px 0 #0a0604">대장장이</h1><span style="font-size: 14px; color: #ffd8a8">초원 · 5층</span></div>
    <div style="display: flex; gap: 8px; align-items: center">
      <span style="display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: rgba(42,28,8,0.92); border: 2px solid #c9952f"><span class="coin" aria-hidden="true"></span><span style="font-family: 'Silkscreen', monospace; font-size: 17px; color: #ffd86a">140</span></span>
      <span style="padding: 8px 12px; background: rgba(18,15,26,0.92); border: 2px solid #4a4058; font-family: 'Silkscreen', monospace; font-size: 15px; color: #ffb0b0">HP 70/103</span>
    </div>
  </header>

  <section style="position: absolute; left: 36px; bottom: 30px; width: 700px; height: 148px; box-sizing: border-box; padding: 32px 26px 18px; background: rgba(16,10,8,0.9); border: 3px solid #0a0604; box-shadow: inset 0 0 0 2px #ff8a3a, 0 8px 0 rgba(0,0,0,0.4)">
    <div style="position: absolute; left: 20px; top: -22px; display: flex; box-shadow: 0 4px 0 rgba(0,0,0,0.4)">
      <span style="padding: 5px 16px; background: #5a3018; border: 3px solid #0a0604; font-family: 'Do Hyeon', sans-serif; font-size: 24px">대장장이</span>
      <span style="padding: 5px 12px; background: #0a0604; border: 3px solid #0a0604; border-left: 0; font-size: 13px; color: #ff8a3a; display: flex; align-items: center">대장간</span>
    </div>
    <p class="type" style="margin: 0; font-size: 20px; line-height: 1.6">"쇠든 카드든 두들기면 단단해지지. 50골드면 한 장 손봐 주겠네. 딱 한 장이야."</p>
    <span class="next" aria-hidden="true" style="position: absolute; right: 18px; bottom: 12px; color: #ff8a3a">▼</span>
  </section>

  <nav style="position: absolute; right: 36px; bottom: 30px; width: 440px; display: flex; flex-direction: column; gap: 10px">
    <a href="Upgrade.dc.html" class="opt inR d1">
      <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 26px">카드 강화</span>
        <span style="font-size: 13px; color: #ffd8a8">카드 한 장 · 룰렛으로 수치 또는 범위 · 강화하면 바로 떠난다</span>
      </span>
      <span class="chip"><span class="coin" aria-hidden="true"></span>50</span>
    </a>
    <a href="RunMap.dc.html" class="opt inR d2">
      <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 26px">나가기</span>
        <span style="font-size: 13px; color: #b9a89a">지도로 돌아간다</span>
      </span>
    </a>
  </nav>
  <span style="position: absolute; right: 36px; top: 84px; padding: 6px 10px; font-size: 12px; color: #b9a89a; background: rgba(10,6,4,0.7)">대장장이 그림을 주시면 여관처럼 통째로 배경으로 바꾼다</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
