<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전투 — 이동 묶음 · 판 눌러 이동</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}a:hover{color:#fff1b8}
.layer{position:absolute;left:0;top:0;width:1280px;height:720px;background-repeat:repeat-x;background-size:1280px 720px;image-rendering:pixelated}
.l-sky{background-image:url(/redesign/bg/grassland/sky.png)}
.l-clouds{background-image:url(/redesign/bg/grassland/clouds.png);animation:drift 90s linear infinite}
.l-mountains{background-image:url(/redesign/bg/grassland/mountains.png)}
.l-hills{background-image:url(/redesign/bg/grassland/hills.png)}
.l-meadow{background-image:url(/redesign/bg/grassland/meadow.png)}
@keyframes drift{to{background-position:-1280px 0}}
.board{background-image:url(/redesign/terrain/grass-tile.png);background-size:64px 64px;image-rendering:pixelated}
.spr{image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation-iteration-count:infinite}
.n6{animation-name:f6;animation-timing-function:steps(6)}
@keyframes f6{to{background-position:120% 0}}
.s-cairn-idle{background-image:url(/redesign/sprites/cairn/idle.png)}
.s-goblin-idle{background-image:url(/redesign/sprites/goblin/idle.png)}
.hz{position:absolute;width:128px;height:128px;image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,0.6))}
.hz-rock{background-image:url(/redesign/terrain/hazards/rock-meadow.png);background-size:768px 128px;background-position:-128px 0}
.hz-bramble{background-image:url(/redesign/terrain/hazards/bramble.png);background-size:896px 128px;animation:f4h 600ms steps(4) infinite}
.hz-fire{background-image:url(/redesign/terrain/hazards/fire.png);background-size:768px 128px;animation:f6 540ms steps(6) infinite}
@keyframes f4h{to{background-position:-512px 0}}
.cell-n{background:rgba(10,30,12,0.08);border-right:1px solid rgba(20,50,20,0.45);border-bottom:1px solid rgba(20,50,20,0.45)}
.foe-tele{position:absolute;width:160px;height:68px;background:rgba(224,72,90,0.42);box-shadow:inset 0 0 0 2px #ff8a8a;pointer-events:none}
.boot{background-image:url(/redesign/ui/move/boot.png);background-size:28px 28px;width:28px;height:28px;image-rendering:pixelated;flex-shrink:0}
.dashi{background-image:url(/redesign/ui/move/dash.png);background-size:14px 14px;width:14px;height:14px;image-rendering:pixelated;display:inline-block;vertical-align:-2px}

/* 판 위 이동 칸 */
.go{position:absolute;width:160px;height:68px;box-sizing:border-box;border:0;padding:0;margin:0;cursor:pointer;background:rgba(244,212,112,0.28);box-shadow:inset 0 0 0 3px #f4d470;animation:blink 1.1s ease-in-out infinite;font:inherit;color:#1d1408;display:flex;align-items:flex-end;justify-content:center}
.go:hover{background:rgba(244,212,112,0.55)}
.go-dash{background:rgba(255,154,58,0.26);box-shadow:inset 0 0 0 3px #ff9a3a;animation-name:blinkd}
.go-dash:hover{background:rgba(255,154,58,0.5)}
@keyframes blink{50%{box-shadow:inset 0 0 0 3px #fff1b8,0 0 16px rgba(244,212,112,0.75)}}
@keyframes blinkd{50%{box-shadow:inset 0 0 0 3px #ffd0a0,0 0 16px rgba(255,154,58,0.75)}}
.go-lab{margin-bottom:5px;padding:1px 7px;font-size:12px;font-weight:700;background:#f4d470;border:2px solid #2a1c10;white-space:nowrap}
.go-dash .go-lab{background:#ff9a3a}
.go-warn{position:absolute;left:4px;top:4px;padding:0 6px;font-size:11px;font-weight:700;background:#3a1016;color:#ff9a9a;border:1px solid #e0485a}
.trail{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#f4d470;color:#1d1408;border:3px solid #2a1c10;font-family:'Silkscreen',monospace;font-size:13px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:none}
.trail-dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff1b8;box-shadow:0 0 0 2px #2a1c10;pointer-events:none}
.ghost{opacity:0.5;filter:brightness(1.5) saturate(0.3) drop-shadow(0 0 0 #f4d470);pointer-events:none}

/* 손패 */
.hc{position:relative;width:96px;height:106px;box-sizing:border-box;padding:6px;display:flex;flex-direction:column;gap:5px;border:2px solid;color:#efe9f5;font:inherit;text-align:left;cursor:pointer}
.hc:hover{transform:translateY(-6px)}
.badge{position:absolute;right:-6px;top:-10px;font-family:'Silkscreen',monospace;font-size:11px;padding:1px 6px;background:#f4d470;color:#1d1408;border:2px solid #2a1c10}

/* 이동 묶음 */
.bundle{position:relative;width:112px;height:120px;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:#efe9f5}
.bundle .back1,.bundle .back2{position:absolute;left:0;right:0;height:110px;background:#10203a;border:2px solid #2a4a78;box-sizing:border-box}
.bundle .back2{top:0;left:8px;right:-0px;transform:translateX(-4px)}
.bundle .back1{top:5px;transform:translateX(-2px)}
.bundle .front{position:absolute;left:0;right:0;bottom:0;height:110px;box-sizing:border-box;padding:6px 7px;background:#14243a;border:2px solid #5aa8ff;box-shadow:inset 0 0 0 2px #0a1424;display:flex;flex-direction:column;gap:5px}
.bundle:hover .front{border-color:#8ad0ff}
.bundle-open .front{border-color:#f4d470;box-shadow:inset 0 0 0 2px #0a1424,0 0 0 2px #f4d470}
.cmp{display:grid;grid-template-columns:repeat(3,14px);gap:2px}
.cmp span{width:14px;height:14px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-size:9px;display:flex;align-items:center;justify-content:center;color:#b9b1c9}

/* 이동 묶음 펼침 */
.tray{position:absolute;left:350px;bottom:150px;padding:12px 14px 14px;background:#120f1a;border:3px solid #0a0810;box-shadow:inset 0 0 0 2px #5aa8ff,0 10px 0 rgba(0,0,0,0.35);display:flex;flex-direction:column;gap:10px;animation:up .18s ease-out 1}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.tray:after{content:'';position:absolute;left:58px;bottom:-14px;width:16px;height:16px;background:#120f1a;border-right:3px solid #0a0810;border-bottom:3px solid #0a0810;transform:rotate(45deg)}
.mc{position:relative;width:78px;height:98px;box-sizing:border-box;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#14243a;border:2px solid #3a6aa8;color:#efe9f5;font:inherit;cursor:pointer}
.mc:hover{border-color:#8ad0ff}
.mc-g{font-size:26px;line-height:30px;color:#8ad0ff;font-weight:700}
.mc-st{margin-top:auto;width:100%;text-align:center;font-size:11px;padding:1px 0}

.btn-ghost{height:34px;background:rgba(18,15,26,0.9);border:2px solid #4a4058;color:#c9c2d6;font:inherit;font-size:13px;cursor:pointer}
.btn-go{height:64px;background:#f4d470;color:#1d1408;border:3px solid #2a1c10;box-shadow:0 5px 0 #7a5418;font-family:'Do Hyeon',sans-serif;font-size:26px;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #5fb4ec; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5">
  <div class="layer l-sky" aria-hidden="true"></div>
  <div class="layer l-clouds" aria-hidden="true"></div>
  <div class="layer l-mountains" aria-hidden="true"></div>
  <div class="layer l-hills" aria-hidden="true"></div>
  <div class="layer l-meadow" aria-hidden="true"></div>

  <header style="position: absolute; left: 24px; right: 24px; top: 16px; height: 84px; display: grid; grid-template-columns: 1fr 220px 1fr; gap: 16px; align-items: stretch">
    <div style="display: flex; gap: 12px; padding: 10px 14px; background: rgba(18,15,26,0.9); border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px #3c9c98">
      <div aria-hidden="true" style="width: 58px; height: 58px; background: #0f2a30; border: 2px solid #3c9c98; overflow: hidden; position: relative">
        <div class="spr n6 s-cairn-idle" style="position: absolute; left: -46px; top: -26px; width: 192px; height: 128px; background-size: 1152px 128px; animation-duration: 720ms"></div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between"><span style="font-family: 'Silkscreen', monospace; font-size: 18px; color: #fff6dc">CAIRN</span><span style="font-size: 12px; color: #bff5ec">불침의 서약 -3 · +2/R</span></div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #ff8a8a">HP</span><div style="flex-grow: 1; height: 12px; background: #0a0810; border: 2px solid #3a3150"><div style="width: 85%; height: 100%; background: #e0485a; box-shadow: inset 0 -3px 0 #a02a3a"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px; text-align: right">88/103</span></div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #7fc8ff">EN</span><div style="flex-grow: 1; height: 8px; background: #0a0810; border: 2px solid #3a3150; position: relative"><div style="width: {{enPct}}%; height: 100%; background: #4a9aff"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px; text-align: right">{{enText}}</span></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(18,15,26,0.9); border: 3px solid #0a0810">
      <span style="font-family: 'Silkscreen', monospace; font-size: 26px; color: #f4d470">ROUND 3</span>
      <span style="font-size: 13px; color: #b6ea6a">초원 · 5층 · 카드 선택</span>
    </div>
    <div style="display: flex; gap: 12px; padding: 10px 14px; background: rgba(18,15,26,0.9); border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px #6ab83a; flex-direction: row-reverse">
      <div aria-hidden="true" style="width: 58px; height: 58px; background: #1e3014; border: 2px solid #6ab83a; overflow: hidden; position: relative">
        <div class="spr n6 s-goblin-idle" style="position: absolute; left: -40px; top: -26px; width: 144px; height: 96px; background-size: 864px 96px; animation-duration: 660ms; transform: scaleX(-1)"></div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; flex-direction: row-reverse"><span style="font-family: 'Do Hyeon', sans-serif; font-size: 20px; color: #fff6dc">고블린</span><span style="font-size: 12px; color: #c9e8a8">다음 행동: 찌르기</span></div>
        <div style="display: flex; align-items: center; gap: 8px; flex-direction: row-reverse"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #ff8a8a">HP</span><div style="flex-grow: 1; height: 12px; background: #0a0810; border: 2px solid #3a3150; display: flex; justify-content: flex-end"><div style="width: 71%; height: 100%; background: #e0485a; box-shadow: inset 0 -3px 0 #a02a3a"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px">17/24</span></div>
        <div style="display: flex; align-items: center; gap: 8px; flex-direction: row-reverse"><span style="font-family: 'Silkscreen', monospace; font-size: 11px; width: 20px; color: #7fc8ff">EN</span><div style="flex-grow: 1; height: 8px; background: #0a0810; border: 2px solid #3a3150; display: flex; justify-content: flex-end"><div style="width: 60%; height: 100%; background: #4a9aff"></div></div><span style="font-family: 'Silkscreen', monospace; font-size: 12px; width: 58px">18</span></div>
      </div>
    </div>
  </header>

  <div style="position: absolute; left: 160px; right: 160px; top: 116px; display: flex; justify-content: center">
    <div style="padding: 8px 18px; background: rgba(18,15,26,0.92); border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px {{coachEdge}}; display: flex; gap: 12px; align-items: center">
      <span class="boot" aria-hidden="true"></span>
      <span style="font-family: 'Do Hyeon', sans-serif; font-size: 21px; color: #fff6dc">{{coachTitle}}</span>
      <span style="font-size: 13px; color: #c9c2d6">{{coachSub}}</span>
    </div>
  </div>

  <div class="board" aria-label="6×4 전투판" style="position: absolute; left: 160px; top: 300px; width: 960px; height: 272px; border: 4px solid #2a1c10; box-shadow: 0 8px 0 #5a3c22, 0 12px 0 #2a1c10; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, 68px)">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="24"><div class="cell-n"></div></sc-for>
  </div>
  <div class="foe-tele" aria-hidden="true" style="left: 644px; top: 372px"></div>

  <div class="hz hz-rock" role="img" aria-label="바위" style="left: 496px; top: 257px"></div>
  <div class="hz hz-bramble" role="img" aria-label="가시덩굴" style="left: 656px; top: 461px"></div>
  <div class="hz hz-fire" role="img" aria-label="불길" style="left: 976px; top: 461px"></div>

  <sc-for list="{{marks}}" as="m" hint-placeholder-count="6">
    <button type="button" class="go {{m.cls}}" onClick="{{m.onTap}}" aria-label="{{m.aria}}" style="left: {{m.x}}px; top: {{m.y}}px">
      <span class="go-warn" style="display: {{m.warnD}}">{{m.warn}}</span>
      <span class="go-lab">{{m.label}}</span>
    </button>
  </sc-for>

  <sc-for list="{{dots}}" as="d" hint-placeholder-count="0"><span class="trail-dot" style="left: {{d.x}}px; top: {{d.y}}px"></span></sc-for>

  <div aria-hidden="true" style="position: absolute; left: 352px; top: 482px; width: 96px; height: 16px; border-radius: 50%; background: rgba(10,30,10,0.4)"></div>
  <div class="spr n6 s-cairn-idle" role="img" aria-label="CAIRN" style="position: absolute; left: 328px; top: 368px; width: 192px; height: 128px; background-size: 1152px 128px; animation-duration: 720ms"></div>
  <sc-if value="{{hasGhost}}" hint-placeholder-val="{{false}}">
    <div class="spr n6 s-cairn-idle ghost" aria-hidden="true" style="position: absolute; left: {{gx}}px; top: {{gy}}px; width: 192px; height: 128px; background-size: 1152px 128px; animation-duration: 720ms"></div>
  </sc-if>
  <div aria-hidden="true" style="position: absolute; left: 846px; top: 414px; width: 70px; height: 14px; border-radius: 50%; background: rgba(10,30,10,0.4)"></div>
  <div class="spr n6 s-goblin-idle" role="img" aria-label="고블린" style="position: absolute; left: 796px; top: 334px; width: 144px; height: 96px; background-size: 864px 96px; animation-duration: 660ms; transform: scaleX(-1)"></div>

  <sc-for list="{{trail}}" as="t" hint-placeholder-count="0"><span class="trail" style="left: {{t.x}}px; top: {{t.y}}px">{{t.n}}</span></sc-for>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 136px; background: linear-gradient(180deg, rgba(18,15,26,0) 0%, rgba(18,15,26,0.92) 22%); display: flex; align-items: flex-end; gap: 16px; padding: 0 24px 12px; box-sizing: border-box">
    <div style="display: flex; gap: 8px; padding: 8px; background: #120f1a; border: 3px solid #0a0810; box-shadow: inset 0 0 0 2px #f4d470">
      <sc-for list="{{slots}}" as="k" hint-placeholder-count="3">
        <button type="button" onClick="{{k.onTap}}" aria-label="{{k.aria}}" style="position: relative; width: 96px; height: 106px; box-sizing: border-box; padding: 6px; margin: 0; display: flex; flex-direction: column; gap: 5px; background: {{k.bg}}; border: 2px {{k.bs}} {{k.edge}}; color: #efe9f5; font: inherit; cursor: pointer">
          <span style="position: absolute; left: -2px; top: -12px; font-family: 'Silkscreen', monospace; font-size: 12px; padding: 1px 6px; background: #f4d470; color: #1d1408">{{k.order}}</span>
          <span style="display: {{k.dEmpty}}; margin: auto; font-size: 12px; color: #6a6478">비어 있음</span>
          <span style="display: {{k.dMove}}; flex-direction: column; align-items: center; gap: 2px; height: 100%">
            <span style="align-self: stretch; display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 10px; margin-top: 4px"><span style="color: #8ad0ff">MOVE</span><span style="color: #b9b1c9">{{k.cd}}</span></span>
            <span style="font-size: 32px; line-height: 40px; font-weight: 700; color: #8ad0ff">{{k.glyph}}</span>
            <span style="margin-top: auto; font-family: 'Do Hyeon', sans-serif; font-size: 15px">{{k.name}}</span>
          </span>
          <span style="display: {{k.dCard}}; flex-direction: column; gap: 5px; height: 100%">
            <span style="display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 10px; margin-top: 4px"><span style="color: #ff9a9a">{{k.dm}}</span><span style="color: #8ad0ff">{{k.en}}</span></span>
            <span style="display: grid; grid-template-columns: repeat(3, 12px); gap: 2px; justify-content: center">
              <sc-for list="{{k.grid}}" as="g" hint-placeholder-count="9"><span style="width: 12px; height: 12px; background: {{g}}"></span></sc-for>
            </span>
            <span style="font-family: 'Do Hyeon', sans-serif; font-size: 15px; text-align: center; margin-top: auto">{{k.name}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <button type="button" class="bundle {{bundleCls}}" onClick="{{toggleTray}}" aria-label="이동 카드 묶음 — 눌러서 펼치기" aria-expanded="{{tray}}">
      <span class="back2" aria-hidden="true"></span>
      <span class="back1" aria-hidden="true"></span>
      <span class="front">
        <span style="display: flex; align-items: center; gap: 4px">
          <span class="boot" aria-hidden="true"></span>
          <span style="display: flex; flex-direction: column; line-height: 1.05">
            <span style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #8ad0ff">MOVE</span>
            <span style="font-family: 'Silkscreen', monospace; font-size: 15px; color: #fff6dc">×{{total}}</span>
          </span>
        </span>
        <span style="display: flex; gap: 6px; align-items: center">
          <span class="cmp" aria-hidden="true">
            <sc-for list="{{compass}}" as="q" hint-placeholder-count="9"><span style="background: {{q.bg}}; box-shadow: {{q.sh}}">{{q.t}}</span></sc-for>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; font-size: 10px; line-height: 1.3; color: #c9c2d6; text-align: left">
            <span>준비 <b style="color: #b6ea6a">{{ready}}</b></span>
            <span>쿨 <b style="color: #b9b1c9">{{cooling}}</b></span>
          </span>
        </span>
        <span style="margin-top: auto; font-size: 11px; color: {{hintColor}}; text-align: center">{{bundleHint}}</span>
      </span>
    </button>

    <div style="display: flex; gap: 8px">
      <sc-for list="{{hand}}" as="k" hint-placeholder-count="6">
        <button type="button" class="hc" onClick="{{k.onTap}}" aria-label="{{k.name}}" style="background: {{k.bg}}; border-color: {{k.edge}}; opacity: {{k.op}}">
          <span style="display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 10px"><span style="color: #ff9a9a">{{k.dm}}</span><span style="color: #8ad0ff">{{k.en}}</span></span>
          <span style="display: grid; grid-template-columns: repeat(3, 12px); gap: 2px; justify-content: center">
            <sc-for list="{{k.grid}}" as="g" hint-placeholder-count="9"><span style="width: 12px; height: 12px; background: {{g}}"></span></sc-for>
          </span>
          <span style="font-family: 'Do Hyeon', sans-serif; font-size: 15px; text-align: center; margin-top: auto">{{k.name}}</span>
          <span class="badge" style="display: {{k.badgeD}}">{{k.badge}}</span>
        </button>
      </sc-for>
    </div>

    <div style="width: 130px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" class="btn-ghost" onClick="{{reset}}">초기화</button>
      <button type="button" class="btn-go">확정 ▶</button>
    </div>
  </footer>

  <sc-if value="{{tray}}" hint-placeholder-val="{{false}}">
    <section class="tray" aria-label="이동 카드 목록">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px">
        <span style="font-family: 'Do Hyeon', sans-serif; font-size: 20px; color: #fff6dc">이동 카드 {{total}}장</span>
        <span style="font-size: 12px; color: #b9b1c9">판의 칸을 눌러도 똑같이 담긴다 · 꾹 누르면 상세</span>
      </div>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{tcards}}" as="m" hint-placeholder-count="7">
          <button type="button" class="mc" onClick="{{m.onTap}}" aria-label="{{m.name}}" style="opacity: {{m.op}}; border-color: {{m.edge}}">
            <span style="align-self: stretch; display: flex; justify-content: space-between; font-family: 'Silkscreen', monospace; font-size: 9px"><span style="color: #8ad0ff">{{m.steps}}</span><span style="color: #b9b1c9">{{m.cdTxt}}</span></span>
            <span class="mc-g">{{m.g}}</span>
            <span style="font-family: 'Do Hyeon', sans-serif; font-size: 13px; text-align: center; line-height: 1.1">{{m.name}}</span>
            <span class="mc-st" style="background: {{m.stBg}}; color: {{m.stFg}}">{{m.st}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slots: [null, null, null], tray: false };
  }
  put(item) {
    const s = this.state.slots.slice();
    const i = s.indexOf(null);
    if (i < 0) return;
    s[i] = item;
    this.setState({ slots: s });
  }
  renderVals() {
    const E = '#2a2438', S = '#f4d470', H = '#e0485a', G = '#7fd6c8', L = '#9ae06a';
    const COLS = 6, ROWS = 4, START = { c: 1, r: 2 }, EN_MAX = 24;
    const cx = (c) => 164 + c * 160, cy = (r) => 304 + r * 68;
    const DIR = { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1], 'up-right': [1, -1] };
    const MOVES = [
      { id: 'm-right', name: '오른쪽', dir: 'right', steps: 1, cd: 0, left: 0, g: '→' },
      { id: 'm-left', name: '왼쪽', dir: 'left', steps: 1, cd: 0, left: 0, g: '←' },
      { id: 'm-up', name: '위', dir: 'up', steps: 1, cd: 0, left: 0, g: '↑' },
      { id: 'm-down', name: '아래', dir: 'down', steps: 1, cd: 0, left: 0, g: '↓' },
      { id: 'm-right2', name: '오른쪽 대시', dir: 'right', steps: 2, cd: 1, left: 0, g: '→→' },
      { id: 'm-ur', name: '↗ 대각 이동', dir: 'up-right', steps: 1, cd: 0, left: 0, g: '↗' },
      { id: 'r-blink', name: '순간 이동', dir: 'right', steps: 3, cd: 2, left: 1, g: '⇢3' },
    ];
    const CARDS = [
      { id: 'c1', name: '방패 밀치기', kind: 'atk', dm: 14, en: 13, grid: [H, E, H, H, S, H, H, E, H] },
      { id: 'c2', name: '파쇄 베기', kind: 'atk', dm: 13, en: 5, grid: [E, E, E, H, S, H, E, E, E] },
      { id: 'c3', name: '대지 가르기', kind: 'atk', dm: 14, en: 12, grid: [H, E, H, H, S, H, H, E, H] },
      { id: 'c4', name: '가드', kind: 'guard', dm: 'BLOCK', en: 6, grid: [E, E, E, E, G, E, E, E, E] },
      { id: 'c5', name: '서약의 파쇄', kind: 'sig', dm: 23, en: 24, grid: [H, E, H, H, S, H, H, E, H] },
      { id: 'c6', name: '수혈', kind: 'heal', dm: 'HP+13', en: 7, grid: [E, E, E, E, L, E, E, E, E] },
    ];
    const KIND = { atk: ['#2a1620', '#8a3040'], guard: ['#122a2a', '#3c9c98'], sig: ['#1e2a46', '#8fb6ff'], heal: ['#18281a', '#6ab83a'] };
    const blocked = (c, r) => c < 0 || r < 0 || c >= COLS || r >= ROWS || (c === 2 && r === 0) || (c === 4 && r === 1);
    const land = (from, m) => {
      const [dx, dy] = DIR[m.dir];
      let cur = { c: from.c, r: from.r };
      for (let i = 0; i < m.steps; i++) {
        if (blocked(cur.c + dx, cur.r + dy)) break;
        cur = { c: cur.c + dx, r: cur.r + dy };
      }
      return cur;
    };
    const HAZ = { '3,3': '가시 → 속박', '5,3': '불 → 5 피해' };

    const slots = this.state.slots;
    const usedIds = slots.filter(Boolean).map((s) => s.ref.id);
    const slotOf = (id) => slots.findIndex((s) => s && s.ref.id === id) + 1;
    const spent = slots.filter((s) => s && s.type === 'card').reduce((a, s) => a + s.ref.en, 0);
    const enLeft = EN_MAX - spent;

    // 이동을 순서대로 적용 → 잔상 위치 · 발자국
    let pos = START;
    const trail = [], dots = [];
    slots.forEach((s, i) => {
      if (!s || s.type !== 'move') return;
      const to = land(pos, s.ref);
      const n = Math.max(Math.abs(to.c - pos.c), Math.abs(to.r - pos.r));
      for (let k = 1; k < n; k++) {
        const fc = pos.c + ((to.c - pos.c) * k) / n, fr = pos.r + ((to.r - pos.r) * k) / n;
        dots.push({ x: cx(fc) + 80, y: cy(fr) + 34 });
      }
      pos = to;
      trail.push({ x: cx(to.c) + 146, y: cy(to.r) + 14, n: String(i + 1) });
    });
    const ghost = pos;
    const hasGhost = ghost.c !== START.c || ghost.r !== START.r;
    const full = slots.every(Boolean);

    // 지금 갈 수 있는 칸 — 같은 칸이면 걸음 수가 적은 카드
    const reach = new Map();
    if (!full) for (const m of MOVES) {
      if (m.left > 0 || usedIds.includes(m.id)) continue;
      const to = land(ghost, m);
      if (to.c === ghost.c && to.r === ghost.r) continue;
      const key = to.c + ',' + to.r;
      const prev = reach.get(key);
      if (!prev || m.steps < prev.steps) reach.set(key, m);
    }
    const marks = [...reach.entries()].map(([key, m]) => {
      const [c, r] = key.split(',').map(Number);
      const dash = m.steps > 1;
      const warn = HAZ[key] || '';
      return {
        x: cx(c), y: cy(r), cls: dash ? 'go-dash' : '',
        label: dash ? `${m.g} ${m.name} · CD${m.cd}` : `${m.g} ${m.name}`,
        warn, warnD: warn ? 'block' : 'none',
        aria: `이동: ${m.name}${warn ? ' — ' + warn : ''}`,
        onTap: () => this.put({ type: 'move', ref: m }),
      };
    });

    const slotVals = slots.map((s, i) => {
      const base = { order: String(i + 1), dEmpty: 'none', dMove: 'none', dCard: 'none', name: '', glyph: '', cd: '', dm: '', en: '', grid: [], bs: 'solid', onTap: () => { const n = this.state.slots.slice(); n[i] = null; this.setState({ slots: n }); } };
      if (!s) return Object.assign(base, { dEmpty: 'block', bg: 'rgba(42,36,56,0.4)', edge: '#4a4058', bs: 'dashed', aria: `${i + 1}번 칸 비어 있음` });
      if (s.type === 'move') return Object.assign(base, { dMove: 'flex', bg: '#14243a', edge: '#5aa8ff', name: s.ref.name, glyph: s.ref.g, cd: s.ref.cd ? 'CD' + s.ref.cd : 'EN0', aria: `${i + 1}번: ${s.ref.name} — 눌러서 빼기` });
      const [bg, edge] = KIND[s.ref.kind];
      return Object.assign(base, { dCard: 'flex', bg, edge, name: s.ref.name, dm: typeof s.ref.dm === 'number' ? 'DM' + s.ref.dm : s.ref.dm, en: 'EN' + s.ref.en, grid: s.ref.grid, aria: `${i + 1}번: ${s.ref.name} — 눌러서 빼기` });
    });

    const hand = CARDS.map((c) => {
      const [bg, edge] = KIND[c.kind];
      const at = slotOf(c.id);
      const poor = !at && c.en > enLeft;
      return {
        name: c.name, dm: typeof c.dm === 'number' ? 'DM' + c.dm : c.dm, en: 'EN' + c.en, grid: c.grid, bg, edge,
        op: at ? 0.45 : poor ? 0.5 : 1, badge: at ? String(at) : '', badgeD: at ? 'block' : 'none',
        onTap: () => { if (!at && !poor) this.put({ type: 'card', ref: c }); },
      };
    });

    // 묶음 앞면의 3×3 나침반: 파랑 = 1칸 준비 · 주황 테 = 대시 준비 · 숫자 = 쿨 · 금 = 순서 칸에 담김
    const ORDER = ['up-left', 'up', 'up-right', 'left', null, 'right', 'down-left', 'down', 'down-right'];
    const compass = ORDER.map((d) => {
      if (!d) return { bg: '#f4d470', sh: 'inset 0 0 0 2px #7a5418', t: '' };
      const ms = MOVES.filter((m) => m.dir === d);
      if (!ms.length) return { bg: '#1a1626', sh: 'none', t: '' };
      const ready = ms.filter((m) => m.left === 0 && !usedIds.includes(m.id));
      const used = ms.some((m) => usedIds.includes(m.id));
      const dashReady = ready.some((m) => m.steps > 1);
      const cdMin = Math.min(...ms.map((m) => m.left || 99));
      if (!ready.length && used) return { bg: '#7a5418', sh: 'none', t: '' };
      if (!ready.length) return { bg: '#2a2438', sh: 'none', t: cdMin < 99 ? String(cdMin) : '' };
      return { bg: '#5aa8ff', sh: dashReady ? 'inset 0 0 0 2px #ff9a3a' : 'none', t: '' };
    });
    const readyN = MOVES.filter((m) => m.left === 0 && !usedIds.includes(m.id)).length;
    const coolN = MOVES.filter((m) => m.left > 0).length;

    const tcards = MOVES.map((m) => {
      const at = slotOf(m.id);
      const to = land(ghost, m);
      const stuck = to.c === ghost.c && to.r === ghost.r;
      let st = '준비', stBg = '#1e3a14', stFg = '#b6ea6a', op = 1, edge = m.steps > 1 ? '#ff9a3a' : '#3a6aa8';
      if (at) { st = at + '번 칸'; stBg = '#f4d470'; stFg = '#1d1408'; op = 0.6; }
      else if (m.left > 0) { st = '쿨 ' + m.left; stBg = '#2a2438'; stFg = '#b9b1c9'; op = 0.5; edge = '#3a3150'; }
      else if (stuck) { st = '막힘'; stBg = '#3a1016'; stFg = '#ff9a9a'; op = 0.6; }
      else if (full) { st = '칸 없음'; stBg = '#2a2438'; stFg = '#b9b1c9'; }
      return {
        name: m.name, g: m.g, steps: m.steps + '칸', cdTxt: m.cd ? 'CD' + m.cd : '—', st, stBg, stFg, op, edge,
        onTap: () => { if (!at && !m.left && !stuck && !full) this.put({ type: 'move', ref: m }); },
      };
    });

    const moveSlots = slots.filter((s) => s && s.type === 'move').length;
    const coachTitle = full ? '3장을 다 골랐다 — 확정!' : moveSlots === 0 ? '노란 칸을 눌러 이동' : `${moveSlots}번째 이동까지 담았다`;
    const coachSub = full ? '이동 → 수비 → 공격 순으로 풀린다' : moveSlots === 0 ? '주황 = 대시(칸 하나로 두 칸) · 빨간 글씨 = 함정' : '잔상 자리에서 다시 갈 수 있는 칸이 밝혀진다 · 순서 칸을 누르면 뺀다';

    return {
      cells: Array.from({ length: 24 }, () => ({})), marks, trail, dots,
      hasGhost, gx: cx(ghost.c) + 4, gy: cy(ghost.r) - 72,
      slots: slotVals, hand, compass, total: String(MOVES.length), ready: String(readyN), cooling: String(coolN),
      bundleHint: this.state.tray ? '▼ 닫기' : full ? '순서 칸이 꽉 찼다' : '▲ 펼치기',
      hintColor: this.state.tray ? '#f4d470' : '#8ad0ff',
      bundleCls: this.state.tray ? 'bundle-open' : '', tray: this.state.tray, tcards,
      toggleTray: () => this.setState({ tray: !this.state.tray }),
      reset: () => this.setState({ slots: [null, null, null] }),
      enPct: Math.round((enLeft / 50) * 100), enText: enLeft === EN_MAX ? String(EN_MAX) : `${enLeft}/${EN_MAX}`,
      coachTitle, coachSub, coachEdge: full ? '#b6ea6a' : '#f4d470',
    };
  }
}
</script>
