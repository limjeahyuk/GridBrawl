<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보스 스프라이트 시트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4d470}a:hover{color:#fff1b8}
.spr{image-rendering:pixelated;background-repeat:no-repeat;background-position:0 0;animation-iteration-count:infinite}
.n3{animation-name:f3;animation-timing-function:steps(3)}
.n6{animation-name:f6;animation-timing-function:steps(6)}
.n8{animation-name:f8;animation-timing-function:steps(8)}
.n10{animation-name:f10;animation-timing-function:steps(10)}
@keyframes f3{to{background-position:150% 0}}
@keyframes f6{to{background-position:120% 0}}
@keyframes f8{to{background-position:114.2857% 0}}
@keyframes f10{to{background-position:111.1111% 0}}
.warden-idle{background-image:url(/redesign/sprites/warden/idle.png)}
.warden-run{background-image:url(/redesign/sprites/warden/run.png)}
.warden-attack1{background-image:url(/redesign/sprites/warden/attack1.png)}
.warden-attack2{background-image:url(/redesign/sprites/warden/attack2.png)}
.warden-hurt{background-image:url(/redesign/sprites/warden/hurt.png)}
.warden-death{background-image:url(/redesign/sprites/warden/death.png)}
.pyrelord-idle{background-image:url(/redesign/sprites/pyrelord/idle.png)}
.pyrelord-run{background-image:url(/redesign/sprites/pyrelord/run.png)}
.pyrelord-attack1{background-image:url(/redesign/sprites/pyrelord/attack1.png)}
.pyrelord-attack2{background-image:url(/redesign/sprites/pyrelord/attack2.png)}
.pyrelord-hurt{background-image:url(/redesign/sprites/pyrelord/hurt.png)}
.pyrelord-death{background-image:url(/redesign/sprites/pyrelord/death.png)}
.overlord-idle{background-image:url(/redesign/sprites/overlord/idle.png)}
.overlord-run{background-image:url(/redesign/sprites/overlord/run.png)}
.overlord-attack1{background-image:url(/redesign/sprites/overlord/attack1.png)}
.overlord-attack2{background-image:url(/redesign/sprites/overlord/attack2.png)}
.overlord-hurt{background-image:url(/redesign/sprites/overlord/hurt.png)}
.overlord-death{background-image:url(/redesign/sprites/overlord/death.png)}
.cellbg{background:linear-gradient(180deg,#1d1828 0%,#1d1828 88%,#2a2438 88%,#2a2438 100%)}
</style>
</helmet>
<div style="width: 1200px; height: 2040px; box-sizing: border-box; padding: 40px 50px; background: #120f1a; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5; display: flex; flex-direction: column; gap: 30px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div>
      <p style="margin: 0 0 6px; font-family: 'Silkscreen', monospace; font-size: 13px; letter-spacing: 4px; color: #f4d470">BOSS SPRITES · ×2 PREVIEW</p>
      <h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 40px; color: #fff6dc">보스 3종</h1>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #b9b1c9; text-align: right">게임 배율 ×2 권장 (영웅보다 1.5배 크게 보인다)</p>
  </div>
  <sc-for list="{{bosses}}" as="b" hint-placeholder-count="3">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 12px; align-items: baseline; padding-bottom: 8px; border-bottom: 2px solid {{b.edge}}">
        <h2 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 28px; color: {{b.accent}}">{{b.name}}</h2>
        <span style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #b9b1c9">{{b.spec}}</span>
        <span style="font-size: 13px; color: #c9c2d6">{{b.look}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{b.clips}}" as="c" hint-placeholder-count="6">
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
            <div class="cellbg" style="border: 2px solid #2a2438; display: flex; justify-content: center">
              <div class="spr {{c.cls}} {{c.n}}" role="img" aria-label="{{c.aria}}" style="width: {{c.w}}px; height: {{c.h}}px; background-size: {{c.bw}}px {{c.h}}px; animation-duration: {{c.d}}ms"></div>
            </div>
            <figcaption style="display: flex; justify-content: space-between; align-items: baseline">
              <span style="font-family: 'Do Hyeon', sans-serif; font-size: 17px">{{c.label}}</span>
              <span style="font-family: 'Silkscreen', monospace; font-size: 10px; color: #b9b1c9">{{c.meta}}</span>
            </figcaption>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":2040}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (id, fw, fh, rows) => rows.map(([clip, label, n, ms, imp]) => ({
      cls: id + '-' + clip, n: 'n' + n, w: fw * 2, h: fh * 2, bw: n * fw * 2, d: n * ms, label,
      aria: id + ' ' + clip, meta: n + 'F ' + ms + 'MS' + (imp != null ? ' HIT' + imp : ''),
    }));
    const bosses = [
      { name: '수호기사 — 초원 7층', spec: '160×112', accent: '#ff8a7a', edge: '#a82c3a',
        look: '뿔 달린 흑철 대투구, 붉은 바이저 · 금장 견갑 · 핏빛 망토 · 룬 대검을 두 손으로.',
        clips: mk('warden', 160, 112, [['idle', '대기', 6, 140], ['run', '이동', 8, 85], ['attack1', '대검 내려베기', 6, 75, 2], ['attack2', '피의 서약 찌르기', 6, 80, 2], ['hurt', '피격', 3, 100], ['death', '사망', 10, 110]]) },
      { name: '화염군주 — 던전 엘리트', spec: '160×112', accent: '#ffb04a', edge: '#ff5a1a',
        look: '용암 균열이 흐르는 현무암 거인. 머리에 불꽃 왕관, 두 주먹이 타오르고 불티가 계속 피어오른다.',
        clips: mk('pyrelord', 160, 112, [['idle', '대기', 8, 110], ['run', '이동', 8, 85], ['attack1', '분화 강타', 6, 80, 2], ['attack2', '화염구 투척', 6, 80, 2], ['hurt', '피격', 3, 100], ['death', '사망', 10, 110]]) },
      { name: '오버로드 — 던전 14층', spec: '176×128', accent: '#d8b8ff', edge: '#8a2ad0',
        look: '금관을 쓴 마왕. 거대한 박쥐 날개와 뼈 낫. 어둠 구슬을 모아 던지고, 죽으면 재가 되어 흩어진다.',
        clips: mk('overlord', 176, 128, [['idle', '대기', 8, 120], ['run', '이동', 8, 90], ['attack1', '낫 베기', 6, 75, 2], ['attack2', '어둠 구슬', 6, 85, 3], ['hurt', '피격', 3, 100], ['death', '소멸', 8, 115]]) },
    ];
    return { bosses };
  }
}
</script>
</body>
</html>
