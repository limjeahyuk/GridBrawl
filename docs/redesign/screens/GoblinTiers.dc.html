<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>고블린 상점 시안 3가지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.gb-p{background-image:url(/redesign/cutscene/goblin/bg-poor.png)}
.gb-m{background-image:url(/redesign/cutscene/goblin/bg-mid.png)}
.gb-r{background-image:url(/redesign/cutscene/goblin/bg-rich.png)}
.shot{position:relative;width:1280px;height:720px;background-size:1280px 720px;background-repeat:no-repeat;overflow:hidden;box-shadow:0 0 0 3px #3a3150;color:#fff6dc}
.opt{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 18px;box-sizing:border-box;background:rgba(20,14,12,0.88);border:2px solid #6a4a30;box-shadow:0 4px 0 rgba(0,0,0,0.45)}
.chip{font-size:13px;padding:3px 9px;font-family:'Silkscreen','Noto Sans KR',monospace;white-space:nowrap;background:#3a1016;color:#ff9a9a;border:1px solid #e0485a}
</style>
</helmet>
<div style="width: 4000px; height: 900px; box-sizing: border-box; padding: 30px 40px; background: #120f1a; font-family: 'Noto Sans KR', sans-serif; color: #efe9f5; display: flex; flex-direction: column; gap: 18px">
  <header>
    <h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 38px; color: #fff6dc">고블린 상점 — 시안 3가지 (가난 · 중간 · 부자)</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #c9c2d6">고블린에게 쓴 돈은 화면에 보여 주지 않는다 — 안에서만 세고, 문턱(80 · 200)을 넘으면 다음에 보이는 고블린이 달라질 뿐이다. 덮쳐서 이기면 다시 가난부터.</p>
  </header>
  <div style="display: flex; gap: 40px">
    <sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
        <div class="shot {{t.cls}}" role="img" aria-label="{{t.name}}">
          <div style="position: absolute; top: 0; bottom: 0; right: 0; width: 760px; background: linear-gradient(90deg, rgba(10,6,4,0) 0%, rgba(10,6,4,0.3) 42%)"></div>
          <span style="position: absolute; left: 32px; top: 18px; font-family: 'Do Hyeon', sans-serif; font-size: 42px; text-shadow: 3px 3px 0 #0a0604">고블린 상점</span>
          <div style="position: absolute; left: 600px; top: 104px; width: 644px; box-sizing: border-box; padding: 26px 24px 16px; background: rgba(16,10,8,0.92); border: 3px solid #0a0604; box-shadow: inset 0 0 0 2px #c9952f, 0 8px 0 rgba(0,0,0,0.4)">
            <div style="position: absolute; left: 18px; top: -20px; display: flex">
              <span style="padding: 3px 14px; background: {{t.bg}}; color: {{t.fg}}; border: 3px solid #0a0604; font-family: 'Do Hyeon', sans-serif; font-size: 21px">{{t.name}}</span>
              <span style="padding: 3px 10px; background: #0a0604; border: 3px solid #0a0604; border-left: 0; font-size: 12px; color: #f4d470; display: flex; align-items: center">{{t.look}}</span>
            </div>
            <p style="margin: 0; font-size: 18px; line-height: 1.55">{{t.line}}</p>
          </div>
          <div style="position: absolute; left: 600px; bottom: 30px; width: 644px; display: flex; flex-direction: column; gap: 10px">
            <div class="opt"><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1"><span style="font-family: 'Do Hyeon', sans-serif; font-size: 26px">거래한다</span><span style="font-size: 13px; color: #ffd8a8">진열 {{t.n}}개 · 값은 물건마다 정가 ×0.8~1.5</span></span></div>
            <div class="opt" style="border-color: #8a3040"><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1"><span style="font-family: 'Do Hyeon', sans-serif; font-size: 26px; color: #ffb0b0">덮친다</span><span style="font-size: 13px; color: #ffb8a8">이기면 {{t.loot}}</span></span><span class="chip">전투 {{t.stars}} · HP {{t.hp}}</span></div>
            <div class="opt"><span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1"><span style="font-family: 'Do Hyeon', sans-serif; font-size: 26px">그냥 지나간다</span><span style="font-size: 13px; color: #b9a89a">아무 일 없이 지도로 돌아간다</span></span></div>
          </div>
        </div>
        <figcaption style="display: flex; gap: 10px; align-items: baseline"><b style="font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: 26px; color: #fff6dc">{{t.name}}</b><span style="font-size: 13px; color: #c9c2d6">{{t.when}} · {{t.src}}</span></figcaption>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4000,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const tiers = [
      { cls: 'gb-p', name: '가난한 고블린', bg: '#4e3420', fg: '#e8d0a0', look: '해진 두건 망토 · 맨발 · 등짐', line: '"헤헤… 오늘 첫 손님이야. 싸게, 아주 싸게 줄게. 제발 사 줘."', n: 3, loot: '골드 20 + 진열품', stars: '★☆☆', hp: 28, when: '안에서 센 돈 0~79', src: 'goblin_2' },
      { cls: 'gb-m', name: '중간 고블린', bg: '#3e5a6a', fg: '#e4f0f8', look: '동그란 안경 · 조끼 · 회중시계', line: '"오, 또 왔네 단골! 덕분에 옷도 새로 맞췄지. 이번엔 물건이 좀 된다고."', n: 4, loot: '골드 55 + 진열품 고르기', stars: '★★☆', hp: 52, when: '80~199', src: 'goblin_1' },
      { cls: 'gb-r', name: '부자 고블린', bg: '#c9952f', fg: '#1d1408', look: '모피 코트 · 금잔 · 왕좌 · 시종들', line: '"흐흐, 자네 덕에 왕좌까지 샀다네. 이 몸의 진짜 물건을 보여 주지 — 값은 좀 나가."', n: 5, loot: '골드 140 + 진열품 + 유물', stars: '★★★', hp: 88, when: '200 이상', src: 'goblin_3' },
    ];
    return { tiers };
  }
}
</script>
</body>
</html>
