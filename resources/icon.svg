<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- bg -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0b0f1c"/>
  <!-- subtle arena grid -->
  <g stroke="#1a2238" stroke-width="6">
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="256" y1="0" x2="256" y2="1024"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
  </g>
  <!-- faint center glow cell -->
  <rect x="262" y="262" width="500" height="500" fill="#122036" opacity="0.55"/>
  <rect x="180" y="180" width="664" height="664" fill="#0f1830" opacity="0.45"/>

  <!-- left yellow bolt accent -->
  <polygon points="188,560 118,730 176,730 132,850 268,668 200,668 250,560"
           fill="#f7c948" stroke="#05070e" stroke-width="14" stroke-linejoin="round"/>
  <!-- right cyan bolt accent -->
  <polygon points="836,540 776,690 826,690 790,800 906,640 846,640 890,540"
           fill="#2ff3ff" stroke="#05070e" stroke-width="14" stroke-linejoin="round" opacity="0.92"/>

  <!-- helmet glow halo -->
  <ellipse cx="500" cy="500" rx="330" ry="290" fill="#29b6cf" opacity="0.10"/>
  <ellipse cx="500" cy="500" rx="240" ry="215" fill="#29b6cf" opacity="0.10"/>

  <!-- helmet body -->
  <polygon points="258,432 546,296 704,452 642,652 356,676 236,544"
           fill="#33405f" stroke="#05070e" stroke-width="26" stroke-linejoin="round"/>
  <!-- helmet shading plate -->
  <polygon points="258,432 546,296 600,350 300,480" fill="#3e4d72" stroke="none"/>
  <polygon points="356,676 642,652 600,600 380,620" fill="#283350" stroke="none"/>
  <!-- fin -->
  <polygon points="546,296 826,158 716,420 630,414"
           fill="#29b6cf" stroke="#05070e" stroke-width="22" stroke-linejoin="round"/>
  <polygon points="586,310 760,222 700,370 640,366" fill="#5ff8ff" opacity="0.55"/>

  <!-- visor glow layers -->
  <rect x="330" y="446" width="330" height="150" rx="52" fill="#2ff3ff" opacity="0.12"/>
  <rect x="352" y="466" width="286" height="110" rx="38" fill="#2ff3ff" opacity="0.22"/>
  <!-- visor -->
  <rect x="374" y="486" width="242" height="72" rx="26" fill="#5ff8ff"/>
  <rect x="392" y="498" width="130" height="24" rx="12" fill="#d9ffff" opacity="0.8"/>

  <!-- jaw vent lines -->
  <g stroke="#05070e" stroke-width="14" stroke-linecap="round">
    <line x1="420" y1="610" x2="470" y2="606"/>
    <line x1="500" y1="604" x2="550" y2="600"/>
  </g>

  <!-- bottom neon baseline (title colors) -->
  <rect x="200" y="866" width="624" height="26" rx="13" fill="#2ff3ff"/>
  <rect x="200" y="866" width="300" height="26" rx="13" fill="#ff4fd8"/>
  <rect x="180" y="846" width="664" height="66" rx="33" fill="#2ff3ff" opacity="0.10"/>
</svg>
